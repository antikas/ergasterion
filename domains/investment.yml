res_configs:
  fund:
    path: models/entity_resolution/res_fund.sql
    stable_key_entity: fund
    golden_key_column: golden_fund_key
    transitive_merge: true
    record_key_expression: concat(source_system, '|', source_record_id)
    merge_iterations: 5
    columns:
    - source_system
    - source_id
    - source_record_id
    - fund_name
    - normalised_name
    - lei
    - shared_external_id
    - canonical_vantora_fund_id
    - asset_class
    - strategy
    - vintage_year
    - currency
    match_keys:
    - column: lei
      expression: concat('lei:', upper(lei))
      type: lei
    - column: shared_external_id
      expression: concat('external:', upper(shared_external_id))
      type: shared_external_id
    - column: canonical_vantora_fund_id
      expression: concat('vantora:', canonical_vantora_fund_id)
      type: normalised_vantora_fund_id
    - column: normalised_name
      expression: concat('name:', normalised_name)
      type: normalised_name
    output_columns:
    - source_system
    - source_id
    - source_record_id
    - fund_name
    - normalised_name
    - deterministic_match_key
    - exact_key_type
    trailing_columns:
    - lei
    - shared_external_id
    - canonical_vantora_fund_id
    - asset_class
    - strategy
    - vintage_year
    - currency
    - match_row_count
    - match_source_count
    tier0:
      key_type: normalised_vantora_fund_id
      tier_label: tier_0_vantora_id_normalisation
    convergence_test: tests/assert_res_fund_er_merge_convergence.sql
  gp:
    path: models/entity_resolution/res_gp.sql
    stable_key_entity: gp
    golden_key_column: golden_gp_key
    columns:
    - source_system
    - source_id
    - gp_name
    - normalised_name
    - lei
    - shared_external_id
    - domicile
    - relationship_start_date
    match_keys:
    - column: lei
      expression: concat('lei:', upper(lei))
      type: lei
    - column: shared_external_id
      expression: concat('external:', upper(shared_external_id))
      type: shared_external_id
    - column: normalised_name
      expression: concat('name:', normalised_name)
      type: normalised_name
    output_columns:
    - source_system
    - source_id
    - gp_name
    - normalised_name
    - deterministic_match_key
    - exact_key_type
    trailing_columns:
    - lei
    - shared_external_id
    - domicile
    - relationship_start_date
    - match_row_count
    - match_source_count
  portfolio_company:
    path: models/entity_resolution/res_portfolio_company.sql
    stable_key_entity: portfolio_company
    golden_key_column: golden_portfolio_company_key
    columns:
    - source_system
    - source_id
    - source_fund_id
    - company_name
    - normalised_name
    - lei
    - shared_external_id
    - sector
    - country
    match_keys:
    - column: lei
      expression: concat('lei:', upper(lei))
      type: lei
    - column: shared_external_id
      expression: concat('external:', upper(shared_external_id))
      type: shared_external_id
    - column: normalised_name
      expression: concat('name:', normalised_name)
      type: normalised_name
    output_columns:
    - source_system
    - source_id
    - source_fund_id
    - company_name
    - normalised_name
    - deterministic_match_key
    - exact_key_type
    trailing_columns:
    - lei
    - shared_external_id
    - sector
    - country
    - match_row_count
    - match_source_count
  deal:
    path: models/entity_resolution/res_deal.sql
    stable_key_entity: deal
    golden_key_column: golden_deal_key
    columns:
    - source_system
    - source_id
    - source_record_id
    - deal_name
    - normalised_name
    - external_deal_id
    - strategy
    - sourced_date
    match_keys:
    - column: external_deal_id
      expression: concat('deal_ext:', upper(external_deal_id))
      type: external_deal_id
    - column: normalised_name
      expression: concat('name:', normalised_name)
      type: normalised_name
    output_columns:
    - source_system
    - source_id
    - source_record_id
    - deal_name
    - normalised_name
    - deterministic_match_key
    - exact_key_type
    trailing_columns:
    - external_deal_id
    - strategy
    - sourced_date
    - match_row_count
    - match_source_count
