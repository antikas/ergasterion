# Domain model config for the INVESTMENT / private-markets example domain.
#
# This file is the per-domain vocabulary the factory emitter (ergasterion/emit.py) reads
# to build the warehouse pipeline. The engine (ergasterion/emit.py + ergasterion/templates/)
# carries ZERO domain nouns; every entity, hub, link, golden-record rule and
# entity-resolution config lives here as data. A second domain is onboarded by dropping
# a sibling domains/<name>.yml beside this file plus its declarations -- no engine edit
# (proven by the fixture-domain test in tests/python/test_emit.py). All domains/*.yml are
# merged at emit time; two domains must not share a key in any section (a collision
# fails the load loudly).
#
# Sections:
#   entity_configs   - per-entity payload / hashed keys / hashdiff / links. The
#                      hashdiff column list is DERIVED at load (payload minus the
#                      entity's hashdiff_exclude set), never hand-listed here.
#   hashdiff_exclude - per-entity payload columns kept OUT of that entity's hashdiff.
#   hub_configs      - per-entity raw-vault hub model + its pk/nk.
#   link_configs     - per-relationship raw-vault link model + its pk/fks.
#   bv_configs       - per-entity business-vault golden-record model + survivorship rules.
#   res_configs      - per-entity entity-resolution model. Optional tier0 block
#                      (key_type + tier_label) drives the tier-0 exact-id normalisation
#                      branch in ergasterion/templates/res_entity.sql.j2; optional
#                      convergence_test names the transitive-merge convergence assert.
#
# CAVEAT for any canonical-mapping model-schema files this domain points at via a
# declaration's canonical_mappings (the optional --openim-root hook): the emitter's
# parse_model_attribute_schema binds only the FIRST '## Attribute schema' table per
# file -- author exactly one attribute-schema table per model-schema file.

# ODCS v3.1.0 boundary config for the contract adapter (ergasterion/emit_contracts.py). This
# block is READ ONLY by the contract emitter; emit.py ignores it. It declares, for this
# domain: the ODCS `domain` name, the contract version/status, the target-warehouse
# `server`, the optional `authoritative_definitions` link (the investment domain cites the
# public OpenIM reference model -- e-commerce deliberately carries none, the agnosticism
# story), and the `products` map: every served table (models/canonical|marts, minus
# int_*/*_base) this domain owns, each optionally bound to a survivorship `entity` whose
# golden-record rules ride the contract as customProperties. A served table missing from
# every domain's products map fails the emitter's completeness gate.
odcs:
  domain: investment
  contract_version: "1.0.0"
  status: active
  server:
    server: ergasterion_snowflake
    type: snowflake
    environment: production
    account: ergasterion
    database: ERGASTERION
    schema: MARTS
  authoritative_definitions:
    - url: https://openinvestmentmodel.org
      type: businessDefinition
  products:
    canonical_fund: {entity: fund}
    canonical_gp: {entity: gp}
    canonical_portfolio_company: {entity: portfolio_company}
    canonical_fund_cash_flow: {}
    canonical_fund_valuation: {}
    canonical_legal_vehicle: {entity: legal_vehicle}
    canonical_legal_vehicle_cash_flow: {}
    canonical_deal: {entity: deal}
    canonical_manager_succession: {}
    dim_fund: {entity: fund}
    dim_gp: {entity: gp}
    dim_portfolio_company: {entity: portfolio_company}
    dim_legal_vehicle: {entity: legal_vehicle}
    dim_deal: {entity: deal}
    dim_deal_stage: {}
    dim_date: {}
    dim_investment_classification: {}
    dim_fund_gp_attribution: {}
    bridge_vehicle_fund_cash_flow: {}
    fact_fund_cash_flow: {}
    fact_fund_valuation: {}
    fact_fund_performance: {}
    fact_investment_classification: {}
    fact_committed_capital_decomposition: {}
    fact_portfolio_exposure: {}
    fact_benchmark_comparison: {}
    fact_deal_pipeline: {}

# Relation vocabulary for the map lane (ergasterion/graph_model.py). Read ONLY by the graph
# emitter family; emit.py / emit_contracts.py / emit_odps.py ignore this block. It names
# each relationship as a typed verb (UPPER_SNAKE + kebab alias, with direction, kind,
# cardinality and an inverse) and binds it to a physical link or a payload column. Endpoints
# are DECLARED here, never inferred from key or column names -- role-named self-edge keys
# (predecessor_gp_hk / successor_gp_hk) and a discriminated polymorphic column both depend on
# that. Verbs carry an open, additive field set: the four fields above are required; unknown
# keys are tolerated so a verb can be enriched with no schema change.
#
# This domain exercises every hard edge shape on real data:
#   * a link-backed self-edge with role-named keys (SUCCEEDED_BY over link gp_succession);
#   * a column-level self-edge (SUBSIDIARY_OF over legal_vehicle.parent_vehicle_id);
#   * a discriminated polymorphic column-level edge (CONVERTED_TO over
#     deal.converted_record_id, keyed by deal.converted_record_type) plus a plain
#     column-level judgment edge (CONCERNS_COMPANY over deal.target_entity_id).
relations:
  verbs:
    MANAGED_BY:
      alias: managed-by
      direction: directed
      kind: association
      cardinality: many_to_one
      inverse: MANAGES
    MANAGES:
      alias: manages
      direction: directed
      kind: association
      cardinality: one_to_many
      inverse: MANAGED_BY
    HOLDS_POSITION_IN:
      alias: holds-position-in
      direction: directed
      kind: association
      cardinality: many_to_many
      inverse: POSITION_HELD_BY
    POSITION_HELD_BY:
      alias: position-held-by
      direction: directed
      kind: association
      cardinality: many_to_many
      inverse: HOLDS_POSITION_IN
    INVESTS_THROUGH:
      alias: invests-through
      direction: directed
      kind: association
      cardinality: many_to_many
      inverse: VEHICLE_OF
    VEHICLE_OF:
      alias: vehicle-of
      direction: directed
      kind: association
      cardinality: many_to_many
      inverse: INVESTS_THROUGH
    SUCCEEDED_BY:
      alias: succeeded-by
      direction: directed
      kind: association
      cardinality: one_to_one
      inverse: SUCCEEDS
    SUCCEEDS:
      alias: succeeds
      direction: directed
      kind: association
      cardinality: one_to_one
      inverse: SUCCEEDED_BY
    TARGETS_COMPANY:
      alias: targets-company
      direction: directed
      kind: association
      cardinality: many_to_one
      inverse: TARGET_OF_DEAL
    TARGET_OF_DEAL:
      alias: target-of-deal
      direction: directed
      kind: association
      cardinality: one_to_many
      inverse: TARGETS_COMPANY
    CONVERTED_TO_FUND:
      alias: converted-to-fund
      direction: directed
      kind: association
      cardinality: one_to_one
      inverse: CONVERTED_FROM_DEAL
    CONVERTED_FROM_DEAL:
      alias: converted-from-deal
      direction: directed
      kind: association
      cardinality: one_to_one
      inverse: CONVERTED_TO_FUND
    SUBSIDIARY_OF:
      alias: subsidiary-of
      direction: directed
      kind: aggregation
      cardinality: many_to_one
      inverse: PARENT_OF
    PARENT_OF:
      alias: parent-of
      direction: directed
      kind: aggregation
      cardinality: one_to_many
      inverse: SUBSIDIARY_OF
    CONVERTED_TO:
      alias: converted-to
      direction: directed
      kind: reference
      cardinality: many_to_one
      inverse: CONVERSION_OF
    CONVERSION_OF:
      alias: conversion-of
      direction: directed
      kind: reference
      cardinality: one_to_many
      inverse: CONVERTED_TO
    CONCERNS_COMPANY:
      alias: concerns-company
      direction: directed
      kind: reference
      cardinality: many_to_one
      inverse: SUBJECT_OF_DEAL
    SUBJECT_OF_DEAL:
      alias: subject-of-deal
      direction: directed
      kind: reference
      cardinality: one_to_many
      inverse: CONCERNS_COMPANY
  bindings:
    # Link-backed edges (physical link tables). source_key/target_key equal the link's src_fk.
    - verb: MANAGED_BY
      source: fund
      target: gp
      link: fund_gp
      source_key: fund_hk
      target_key: gp_hk
    - verb: HOLDS_POSITION_IN
      source: fund
      target: portfolio_company
      link: fund_portfolio_company
      source_key: fund_hk
      target_key: portfolio_company_hk
    - verb: INVESTS_THROUGH
      source: fund
      target: legal_vehicle
      link: investment_vehicle
      source_key: fund_hk
      target_key: legal_vehicle_hk
    # Link-backed self-edge: both role keys resolve to the gp hub; the declared keys order
    # predecessor before successor -- endpoint ordering that no key-name inference could do.
    - verb: SUCCEEDED_BY
      source: gp
      target: gp
      link: gp_succession
      source_key: predecessor_gp_hk
      target_key: successor_gp_hk
    - verb: TARGETS_COMPANY
      source: deal
      target: portfolio_company
      link: deal_target_company
      source_key: deal_hk
      target_key: portfolio_company_hk
    - verb: CONVERTED_TO_FUND
      source: deal
      target: fund
      link: deal_fund_conversion
      source_key: deal_hk
      target_key: fund_hk
    # Column-level self-edge over a payload column: legal_vehicle references its parent.
    - verb: SUBSIDIARY_OF
      source: legal_vehicle
      target: legal_vehicle
      column: parent_vehicle_id
    # Column-level discriminated polymorphic edge: a deal converts to a fund or a portfolio
    # company; the target is selected by converted_record_type. Type-graph knowledge only.
    - verb: CONVERTED_TO
      source: deal
      column: converted_record_id
      discriminator:
        column: converted_record_type
        map:
          fund: fund
          portfolio_company: portfolio_company
    # Column-level judgment edge: the deal's target_entity_id is declared to name a
    # portfolio company (a pinned modelling judgment, not inferred).
    - verb: CONCERNS_COMPANY
      source: deal
      target: portfolio_company
      column: target_entity_id

