# Landing product: The delivered history of which segment each customer sat in, one row per version, effective from a date.
#
# The estate's `landed` label gives Batch Ingestion to the ingestion
# runtime and this relation, its validation, its publication and its retry
# wrapper to the SQL translator, so the relation is materialised from the
# delivered extract with no column changed (architecture section 5, the
# landing profile; owner ruling R1).
#
# Its schema has one origin: the relation it lands, bound here with the
# fields that relation delivers (owner ruling R5). Every column is a
# string, because a delivered extract states its values as text; the
# products downstream declare the types they need and cast to them. This
# is the only product that reads the delivered relation: nothing else in
# the estate does.
product:
  name: customer_segment_history
  domain: reference
  version: "1.0"
  layer: landed
  owner: reference-domain

sources:
  - contract: reference.customer_segment_history_delivery@1
    kind: fixture
    fixture:
      relation: customer_segment_history_seed
      fields:
        - {name: customer_external_id, type: string}
        - {name: segment, type: string}
        - {name: effective_from, type: string}
        - {name: record_source, type: string}
        - {name: load_datetime, type: string}
    expect:
      fields: [customer_external_id, segment, effective_from]

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: daily
    extract_mode: full
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: customer_external_id, not_null: true}
      - {field: segment, not_null: true}
      - {field: effective_from, not_null: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The delivered history of which segment each customer sat in, one row per version, effective from a date."
    ownership: reference-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 05:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
