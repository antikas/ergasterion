# The date spine the investment facts are analysed along, typed. The
# delivered extract states its values as text, which is what a delivered
# extract does; this product is where they become dates, numbers and
# flags, so a fact joins an instant to an instant.
product:
  name: investment_calendar
  domain: reference
  version: "1.0"
  layer: silver
  profile: derivation
  owner: reference-domain

sources:
  - contract: reference.investment_calendar_dates@1
    expect:
      fields:
        - calendar_date
        - year_number
        - quarter_number
        - month_number
        - month_start_date
        - quarter_start_date
        - is_month_end
        - is_quarter_end

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: calendar_date, not_null: true}
      - {field: calendar_date, unique: true}
  - pattern: schema_transform
    mapping:
      - {from: calendar_date, to: calendar_date_text, type: string}
      - {from: year_number, to: calendar_year_text, type: string}
      - {from: quarter_number, to: calendar_quarter_text, type: string}
      - {from: month_number, to: calendar_month_text, type: string}
      - {from: month_start_date, to: calendar_month_start_text, type: string}
      - {from: quarter_start_date, to: calendar_quarter_start_text, type: string}
      - {from: is_month_end, to: calendar_month_end_text, type: string}
      - {from: is_quarter_end, to: calendar_quarter_end_text, type: string}
      - {from: day_of_month, drop: true}
  - pattern: calculated_fields
    fields:
      - {name: calendar_date, type: date, expression: "calendar_date_text"}
      - {name: calendar_year, type: integer, expression: "calendar_year_text"}
      - {name: calendar_quarter, type: integer, expression: "calendar_quarter_text"}
      - {name: calendar_month, type: integer, expression: "calendar_month_text"}
      - {name: calendar_month_start, type: date, expression: "calendar_month_start_text"}
      - {name: calendar_quarter_start, type: date, expression: "calendar_quarter_start_text"}
      - {name: calendar_is_month_end, type: boolean, expression: "calendar_month_end_text = 'true'"}
      - {name: calendar_is_quarter_end, type: boolean, expression: "calendar_quarter_end_text = 'true'"}
      - {name: calendar_quarter_label, type: string, expression: "concat(substr(calendar_date_text, 1, 4), '-Q', calendar_quarter_text)"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "One row per calendar day, with the month and quarter it falls in and whether it closes either."
    ownership: reference-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
