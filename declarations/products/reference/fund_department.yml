# Which department each fund sat in, one row per version, effective from
# a date, so a product that asks which department a fund sat in on a given
# day has a relation to ask.
#
# The delivered history states classifications of more than one kind, for
# more than one kind of entity. The declared predicate keeps the fund
# department rows, and the exclusions it makes are counted and logged
# rather than quietly dropped.
product:
  name: fund_department
  domain: reference
  version: "1.0"
  layer: silver
  profile: derivation
  owner: reference-domain

sources:
  - contract: reference.investment_classification_history@1
    expect:
      fields:
        - entity_type
        - entity_external_id
        - classification_type_code
        - classification_value_code
        - effective_from
        - record_source
        - load_datetime

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: entity_external_id, not_null: true}
      - {field: effective_from, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: entity_type, to: classification_entity_type, type: string}
      - {from: entity_external_id, to: fund_external_identity, type: string}
      - {from: classification_type_code, to: classification_type_code, type: string}
      - {from: classification_value_code, to: fund_department_code, type: string}
      - {from: effective_from, to: department_effective_from, type: date}
      - {from: record_source, to: classification_record_source, type: string}
      - {from: load_datetime, to: classification_load_datetime, type: timestamp}
  - pattern: calculated_fields
    fields:
      - {name: classification_key, type: string, expression: "concat(classification_type_code, ':', fund_department_code)"}
      - {name: fund_department_key, type: string, expression: "concat(fund_external_identity, ':', classification_type_code)"}
  - pattern: data_enrichment
    lookups:
      - contract: reference.investment_classification@1
        "on": {classification_key: classification_key}
        fields: [classification_value_name, classification_type_name]
        no_match: null
  - pattern: data_filtering
    predicates:
      - name: fund_department_history_only
        expression: "classification_entity_type = 'FUND' and classification_type_code = 'DEPT'"
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The department each fund sat in, one row per version, effective from a date."
    ownership: reference-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
