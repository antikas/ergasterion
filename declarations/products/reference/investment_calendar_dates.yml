# Landing product: The delivered date spine the investment facts are analysed along, one row per calendar day.
#
# The estate's `landed` label gives Batch Ingestion to the ingestion
# runtime and this relation, its validation, its publication and its retry
# wrapper to the SQL translator, so the relation is materialised from the
# delivered extract with no column changed (architecture section 5, the
# landing profile; owner ruling R1).
#
# Its schema has one origin: the relation it lands, bound here with the
# fields that relation delivers (owner ruling R5). Every column is a
# string, because a delivered extract states its values as text; the lane
# products downstream declare the types they need and cast to them. This
# is the only product that reads the delivered relation: nothing else in
# the estate does.
product:
  name: investment_calendar_dates
  domain: reference
  version: "1.0"
  layer: landed
  owner: reference-domain

sources:
  - contract: reference.investment_calendar_dates_delivery@1
    kind: fixture
    fixture:
      relation: investment_calendar_dates
      fields:
        - {name: calendar_date, type: string}
        - {name: year_number, type: string}
        - {name: quarter_number, type: string}
        - {name: month_number, type: string}
        - {name: day_of_month, type: string}
        - {name: month_start_date, type: string}
        - {name: quarter_start_date, type: string}
        - {name: is_month_end, type: string}
        - {name: is_quarter_end, type: string}
    expect:
      fields: [calendar_date, year_number, quarter_number]

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: daily
    extract_mode: full
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: calendar_date, not_null: true}
      - {field: calendar_date, unique: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The delivered date spine the investment facts are analysed along, one row per calendar day."
    ownership: reference-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 05:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
