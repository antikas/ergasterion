# The configuration the estate declares about a fund, computed once and
# published as a product (owner ruling R5, plan decision D31: the
# configuration seeds become declaration configuration on the
# calculated-field products, not relations anything reads).
#
# Two things are declared here. The invested-capital basis is the part of
# the capital a fund called that does not count as invested: recallable
# return-of-capital distributions and a management-fee offset. The hurdle
# is the return a fund has to clear, by strategy, with one fund carrying
# an override of its own.
#
# A fund the estate declares no basis for excludes nothing, and a
# strategy it declares no hurdle for leaves the hurdle unstated rather
# than assuming one.
product:
  name: fund_investment_basis
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.fund_conformed@1
    expect:
      fields:
        - source_record_id
        - source_fund_id
        - source_name
        - source_family_name
        - source_vehicle_type
        - source_lei
        - source_external_id
        - source_gp_id
        - source_gp_name
        - source_gp_lei
        - source_asset_class
        - source_strategy
        - source_vintage_year
        - source_committed_capital_usd
        - source_currency
        - source_domicile
        - source_status
        - source_reported_on
        - fund_source_system
        - fund_identity_key
        - fund_normalised_name
        - fund_normalised_gp_name
        - fund_lei
        - fund_external_id
        - fund_gp_lei
        - fund_business_key
        - fund_gp_lookup_key
        - gp_business_key

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: fund_business_key, not_null: true}
  - pattern: calculated_fields
    fields:
      - {name: fund_recallable_distributions_usd, type: {name: decimal, precision: 18, scale: 2}, expression: "case when fund_external_id = 'OPENIM-FUND-APEX-II' then 700000 when fund_external_id = 'OPENIM-FUND-ORION-I' then 200000 else 0 end"}
      - {name: fund_fee_offset_usd, type: {name: decimal, precision: 18, scale: 2}, expression: "case when fund_external_id = 'OPENIM-FUND-APEX-II' then 200000 when fund_external_id = 'OPENIM-FUND-ORION-I' then 150000 else 0 end"}
      - {name: fund_hurdle_rate, type: {name: decimal, precision: 6, scale: 4}, expression: "case when fund_external_id = 'OPENIM-FUND-APEX-II' then 1.30 when source_strategy = 'growth' then 1.25 when source_strategy = 'buyout' then 1.60 when source_strategy = 'core_plus' then 1.15 when source_strategy = 'direct_lending' then 0.08 when source_strategy = 'early_stage' then 1.80 end"}
      - {name: fund_hurdle_basis, type: string, expression: "case when fund_external_id = 'OPENIM-FUND-APEX-II' then 'fund_override' when source_strategy is null then null else 'strategy_default' end"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The invested-capital basis and the return hurdle the estate declares for each fund record."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
