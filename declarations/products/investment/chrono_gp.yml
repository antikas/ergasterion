# One source system's lane onto the schema the general partner products
# share. Three of the four systems state the manager only as columns of
# their fund feed, so this lane reads that feed and keeps the manager
# columns alone.
product:
  name: chrono_gp
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.chrono_fund_extract@1
    expect:
      fields:
        - chrono_row_uid
        - manager_master_code
        - manager_name_text
        - manager_lei
        - domicile_iso2
        - snapshot_date

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: manager_name_text, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: chrono_row_uid, to: source_record_id, type: string}
      - {from: manager_master_code, to: source_gp_id, type: string}
      - {from: manager_name_text, to: source_name, type: string}
      - {from: manager_lei, to: source_lei, type: string}
      - {from: domicile_iso2, to: source_domicile, type: string}
      - {from: snapshot_date, to: source_reported_on, type: date}
      - {from: chrono_vehicle_code, drop: true}
      - {from: vehicle_display_name, drop: true}
      - {from: vehicle_group_name, drop: true}
      - {from: vehicle_form, drop: true}
      - {from: legal_entity_identifier, drop: true}
      - {from: vendor_crosswalk_id, drop: true}
      - {from: private_market_bucket, drop: true}
      - {from: investment_style, drop: true}
      - {from: launch_year, drop: true}
      - {from: commitment_amount_usd, drop: true}
      - {from: reporting_ccy, drop: true}
      - {from: lifecycle_state, drop: true}
  - pattern: calculated_fields
    fields:
      - {name: source_external_id, type: string, expression: "null"}
      - {name: source_relationship_start_date, type: date, expression: "null"}
      - {name: gp_source_system, type: string, expression: "'chrono'"}
      - {name: gp_identity_key, type: string, expression: "concat('chrono', ':', source_record_id)"}
      - {name: gp_normalised_name, type: string, rule: investment_normalised_name_v1, rule_version: 1}
      - {name: gp_lei, type: string, expression: "nullif(trim(source_lei), '')"}
      - {name: gp_external_id, type: string, expression: "null"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "General partners as CHRONO states them, on the schema the four manager feeds share."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
