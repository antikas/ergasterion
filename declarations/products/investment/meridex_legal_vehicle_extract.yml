# Landing product: The MERIDEX administrator legal vehicle feed as it was delivered, one row per delivered vehicle record.
#
# The estate's `landed` label gives Batch Ingestion to the ingestion
# runtime and this relation, its validation, its publication and its retry
# wrapper to the SQL translator, so the relation is materialised from the
# delivered extract with no column changed (architecture section 5, the
# landing profile; owner ruling R1).
#
# Its schema has one origin: the relation it lands, bound here with the
# fields that relation delivers (owner ruling R5). Every column is a
# string, because a delivered extract states its values as text; the lane
# products downstream declare the types they need and cast to them. This
# is the only product that reads the delivered relation: nothing else in
# the estate does.
product:
  name: meridex_legal_vehicle_extract
  domain: investment
  version: "1.0"
  layer: landed
  owner: investment-domain

sources:
  - contract: investment.meridex_legal_vehicle_extract_delivery@1
    kind: fixture
    fixture:
      relation: raw_meridex_legal_vehicles
      fields:
        - {name: vehicle_id, type: string}
        - {name: meridex_fund_id, type: string}
        - {name: parent_vehicle_id, type: string}
        - {name: vehicle_name, type: string}
        - {name: vehicle_type, type: string}
        - {name: jurisdiction, type: string}
        - {name: incorporation_date, type: string}
        - {name: vehicle_lei, type: string}
    expect:
      fields: [vehicle_id, meridex_fund_id, parent_vehicle_id]

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: daily
    extract_mode: full
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: vehicle_id, not_null: true}
      - {field: vehicle_id, unique: true}
      - {field: vehicle_name, not_null: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The MERIDEX administrator legal vehicle feed as it was delivered, one row per delivered vehicle record."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 05:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
