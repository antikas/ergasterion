# One source system's lane onto the schema the fund cash flow products
# share: one row per delivered cash flow event, under the fund identifier
# that system states it against.
product:
  name: chrono_cash_flow
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.chrono_cash_flow_extract@1
    expect:
      fields:
        - event_uid
        - vehicle_code
        - event_date
        - event_kind
        - investor_direction
        - usd_amount
        - currency_code

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: event_uid, not_null: true}
      - {field: event_date, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: event_uid, to: source_record_id, type: string}
      - {from: vehicle_code, to: source_fund_id, type: string}
      - {from: event_date, to: source_cash_flow_on, type: date}
      - {from: event_kind, to: source_cash_flow_type, type: string}
      - {from: investor_direction, to: source_direction, type: string}
      - {from: usd_amount, to: source_amount_usd, type: {name: decimal, precision: 18, scale: 2}}
      - {from: currency_code, to: source_currency, type: string}
  - pattern: calculated_fields
    fields:
      - {name: cash_flow_source_system, type: string, expression: "'chrono'"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Fund cash flows as CHRONO states them, on the schema the four cash flow feeds share."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
