# The consolidating product every lane of one entity meets in (architecture
# section 8, two or more non-landing product sources with a union
# composition and declared schema conformance across them). Every lane
# publishes the same schema, so the union needs no per-source conformance,
# and the coverage rule proves that every row every lane brought is still a
# row here.
#
# It is also where the business key is computed, once: the identifier the
# estate resolves the entity on, taken in the order the estate ranks them.
# One product owns that expression and every product downstream reads it.
#
# Coverage is proved here, by a declared reconcile rule against every lane
# this union combines, and by the known-answer assertions under
# tests/investment/ beside it. Every lane of an entity states a column some
# source system does not, and the coverage rule compares those null-safely,
# so a lane that never states a column is covered rather than reported
# missing on every row.
product:
  name: gp_conformed
  domain: investment
  version: "1.0"
  layer: silver
  profile: consolidation
  owner: investment-domain

sources:
  - contract: investment.chrono_gp@1
    expect:
      fields:
        - source_record_id
        - source_gp_id
        - source_name
        - source_lei
        - source_external_id
        - source_domicile
        - source_relationship_start_date
        - source_reported_on
        - gp_source_system
        - gp_identity_key
        - gp_normalised_name
        - gp_lei
        - gp_external_id
  - contract: investment.meridex_gp@1
    expect:
      fields:
        - source_record_id
        - source_gp_id
        - source_name
        - source_lei
        - source_external_id
        - source_domicile
        - source_relationship_start_date
        - source_reported_on
        - gp_source_system
        - gp_identity_key
        - gp_normalised_name
        - gp_lei
        - gp_external_id
  - contract: investment.portiq_gp@1
    expect:
      fields:
        - source_record_id
        - source_gp_id
        - source_name
        - source_lei
        - source_external_id
        - source_domicile
        - source_relationship_start_date
        - source_reported_on
        - gp_source_system
        - gp_identity_key
        - gp_normalised_name
        - gp_lei
        - gp_external_id
  - contract: investment.vantora_gp@1
    expect:
      fields:
        - source_record_id
        - source_gp_id
        - source_name
        - source_lei
        - source_external_id
        - source_domicile
        - source_relationship_start_date
        - source_reported_on
        - gp_source_system
        - gp_identity_key
        - gp_normalised_name
        - gp_lei
        - gp_external_id

combine:
  method: union

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: source_record_id, not_null: true}
      - {field: gp_identity_key, not_null: true}
      - reconcile:
          metric: row_count
          contracts: [investment.chrono_gp@1, investment.meridex_gp@1, investment.portiq_gp@1, investment.vantora_gp@1]
  - pattern: calculated_fields
    fields:
      - {name: gp_business_key, type: string, expression: "coalesce(gp_lei, gp_external_id, gp_normalised_name)"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Every manager record all four source systems state, under one schema, with the identifier the estate resolves it on."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
