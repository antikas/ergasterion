# Landing product: The PORTIQ portfolio system portfolio company feed as it was delivered, one row per delivered company record.
#
# The estate's `landed` label gives Batch Ingestion to the ingestion
# runtime and this relation, its validation, its publication and its retry
# wrapper to the SQL translator, so the relation is materialised from the
# delivered extract with no column changed (architecture section 5, the
# landing profile; owner ruling R1).
#
# Its schema has one origin: the relation it lands, bound here with the
# fields that relation delivers (owner ruling R5). Every column is a
# string, because a delivered extract states its values as text; the lane
# products downstream declare the types they need and cast to them. This
# is the only product that reads the delivered relation: nothing else in
# the estate does.
product:
  name: portiq_portfolio_company_extract
  domain: investment
  version: "1.0"
  layer: landed
  owner: investment-domain

sources:
  - contract: investment.portiq_portfolio_company_extract_delivery@1
    kind: fixture
    fixture:
      relation: raw_portiq_portfolio_companies
      fields:
        - {name: portiq_company_id, type: string}
        - {name: portiq_fund_id, type: string}
        - {name: company_name, type: string}
        - {name: company_lei, type: string}
        - {name: shared_external_id, type: string}
        - {name: sector, type: string}
        - {name: country, type: string}
    expect:
      fields: [portiq_company_id, portiq_fund_id, company_name]

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: daily
    extract_mode: full
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: portiq_company_id, not_null: true}
      - {field: portiq_company_id, unique: true}
      - {field: company_name, not_null: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The PORTIQ portfolio system portfolio company feed as it was delivered, one row per delivered company record."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 05:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
