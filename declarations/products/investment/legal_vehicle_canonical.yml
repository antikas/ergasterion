# A canonical interface over one curated product: one relation per
# canonical entity, each a view at the declared interface boundary
# (declarations/targets/interfaces.yml, architecture section 6).
#
# Every column it publishes is named as the reference model names it. The
# reference block on each entity below records which published column
# carries which reference-model attribute, and validate-canonical proves it
# against the reference model checkout; this product is where the estate
# publishes that vocabulary, so a consumer reads the agreed name rather than
# one source system's spelling.
#
# The reference model identifies these entities by their external
# identifiers, so the identifier the estate resolved the entity on is
# published under that name.
product:
  name: legal_vehicle_canonical
  domain: investment
  version: "1.0"
  layer: gold
  profile: serving
  owner: investment-domain

sources:
  - contract: investment.legal_vehicle_vault@1
    relation: golden_legal_vehicle
    expect:
      fields:
        - legal_vehicle_hk
        - vehicle_business_key
        - vehicle_name
        - vehicle_type
        - vehicle_jurisdiction
        - vehicle_incorporated_on
        - vehicle_lei
        - vehicle_fund_business_key
        - vehicle_fund_source_id
        - vehicle_parent_source_id
        - load_datetime
        - record_source

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: vehicle_business_key, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: vehicle_business_key, to: vehicle_id, type: string}
      - {from: vehicle_lei, to: lei, type: string}
      - {from: vehicle_name, to: vehicle_name, type: string}
      - {from: vehicle_type, to: vehicle_type, type: string}
      - {from: vehicle_jurisdiction, to: jurisdiction, type: string}
      - {from: vehicle_incorporated_on, to: incorporation_date, type: date}
      - {from: vehicle_fund_business_key, to: investment_id, type: string}
      - {from: legal_vehicle_hk, drop: true}
      - {from: vehicle_fund_source_id, drop: true}
      - {from: vehicle_parent_source_id, drop: true}
      - {from: load_datetime, drop: true}
      - {from: record_source, drop: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The canonical legal vehicle interface, published under the reference model's own attribute names."
    ownership: investment-domain
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: canonical
  shape_config:
    entities:
      - name: legal_vehicle
        key: [vehicle_id]
        columns: [vehicle_id, lei, vehicle_name, vehicle_type, jurisdiction, incorporation_date, investment_id]
        description: "The legal vehicle as the reference model states one."
        # Which entity of the reference model this one is the estate's
        # reading of, and which of its attributes each column carries.
        # PM-05 Legal Vehicle.
        reference:
          entity: PM-05
          attributes:
            vehicle_id: vehicle_id
            lei: lei
            vehicle_name: vehicle_name
            vehicle_type: vehicle_type
            jurisdiction: jurisdiction
            incorporation_date: incorporation_date
            investment_id: investment_id
  contract:
    freshness: "daily by 09:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
