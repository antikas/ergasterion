# Manager succession as the book of record states it: which manager
# succeeded which, on what date and by what kind of event.
product:
  name: vantora_gp_succession
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.vantora_succession_event_extract@1
    expect:
      fields:
        - succession_event_id
        - predecessor_gp_id
        - successor_gp_id
        - event_type
        - effective_date

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: succession_event_id, not_null: true}
      - {field: effective_date, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: succession_event_id, to: source_record_id, type: string}
      - {from: predecessor_gp_id, to: source_predecessor_gp_id, type: string}
      - {from: successor_gp_id, to: source_successor_gp_id, type: string}
      - {from: event_type, to: source_event_type, type: string}
      - {from: effective_date, to: source_effective_on, type: date}
  - pattern: calculated_fields
    fields:
      - {name: succession_source_system, type: string, expression: "'vantora'"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Manager succession events as VANTORA states them."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
