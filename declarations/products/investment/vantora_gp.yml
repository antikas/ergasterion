# One source system's lane onto the schema the general partner products
# share. Three of the four systems state the manager only as columns of
# their fund feed, so this lane reads that feed and keeps the manager
# columns alone.
#
# VANTORA is the only system that states the manager as a feed of its
# own, with the date the relationship started and a shared identifier.
#
# This source delivers no snapshot date. The estate reads its extract as
# standing at the reporting date the dated sources report at, 2025-12-31,
# declared here once so every product downstream orders one instant
# against another rather than against nothing.
product:
  name: vantora_gp
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.vantora_gp_extract@1
    expect:
      fields:
        - vantora_gp_id
        - gp_name
        - gp_lei
        - shared_external_id
        - domicile
        - relationship_start_date

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: vantora_gp_id, not_null: true}
      - {field: gp_name, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: vantora_gp_id, to: source_gp_id, type: string}
      - {from: gp_name, to: source_name, type: string}
      - {from: gp_lei, to: source_lei, type: string}
      - {from: shared_external_id, to: source_external_id, type: string}
      - {from: domicile, to: source_domicile, type: string}
      - {from: relationship_start_date, to: source_relationship_start_date, type: date}
  - pattern: calculated_fields
    fields:
      - {name: source_record_id, type: string, expression: "source_gp_id"}
      - {name: source_reported_on, type: date, expression: "date '2025-12-31'"}
      - {name: gp_source_system, type: string, expression: "'vantora'"}
      - {name: gp_identity_key, type: string, expression: "concat('vantora', ':', source_gp_id)"}
      - {name: gp_normalised_name, type: string, rule: investment_normalised_name_v1, rule_version: 1}
      - {name: gp_lei, type: string, expression: "nullif(trim(source_lei), '')"}
      - {name: gp_external_id, type: string, expression: "nullif(trim(source_external_id), '')"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "General partners as VANTORA states them, on the schema the four manager feeds share."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
