# One source system's lane onto the schema the fund products share.
#
# It keeps nothing of that system's own column names past this point. The
# delivered value of every identifier stays beside the value the estate
# resolves on, which is the delivered one with a blank read as nothing, so
# two funds neither system identifies are never merged on an empty string.
#
# VANTORA is the book of record and delivers a dated snapshot per fund,
# so one fund reaches this lane as several rows. It states no manager
# legal entity identifier.
product:
  name: vantora_fund
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.vantora_fund_extract@1
    expect:
      fields:
        - vantora_record_id
        - vantora_fund_id
        - fund_name
        - fund_lei
        - shared_external_id
        - gp_source_id
        - gp_name
        - as_of_date

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: vantora_record_id, not_null: true}
      - {field: fund_name, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: vantora_record_id, to: source_record_id, type: string}
      - {from: vantora_fund_id, to: source_fund_id, type: string}
      - {from: fund_name, to: source_name, type: string}
      - {from: fund_family_name, to: source_family_name, type: string}
      - {from: vehicle_type, to: source_vehicle_type, type: string}
      - {from: fund_lei, to: source_lei, type: string}
      - {from: shared_external_id, to: source_external_id, type: string}
      - {from: gp_source_id, to: source_gp_id, type: string}
      - {from: gp_name, to: source_gp_name, type: string}
      - {from: asset_class, to: source_asset_class, type: string}
      - {from: strategy, to: source_strategy, type: string}
      - {from: vintage_year, to: source_vintage_year, type: integer}
      - {from: committed_capital_usd, to: source_committed_capital_usd, type: {name: decimal, precision: 18, scale: 2}}
      - {from: currency, to: source_currency, type: string}
      - {from: domicile, to: source_domicile, type: string}
      - {from: fund_status, to: source_status, type: string}
      - {from: as_of_date, to: source_reported_on, type: date}
  - pattern: calculated_fields
    fields:
      - {name: source_gp_lei, type: string, expression: "null"}
      - {name: fund_source_system, type: string, expression: "'vantora'"}
      - {name: fund_identity_key, type: string, expression: "concat('vantora', ':', source_record_id)"}
      - {name: fund_normalised_name, type: string, rule: investment_normalised_name_v1, rule_version: 1}
      - {name: fund_normalised_gp_name, type: string, rule: investment_normalised_gp_name_v1, rule_version: 1}
      - {name: fund_lei, type: string, expression: "nullif(trim(source_lei), '')"}
      - {name: fund_external_id, type: string, expression: "nullif(trim(source_external_id), '')"}
      - {name: fund_gp_lei, type: string, expression: "nullif(trim(source_gp_lei), '')"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Funds as VANTORA states them, on the schema the four fund feeds share."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
