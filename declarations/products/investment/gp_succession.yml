# Which manager succeeded which, on what date and by what kind of event,
# against the manager the estate resolved as the successor.
#
# Only the book of record states succession, and it states it by its own
# manager identifiers, so the successor is read on the identifier that
# system states and the predecessor stays as delivered.
product:
  name: gp_succession
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.vantora_gp_succession@1
    expect:
      fields:
        - source_record_id
        - source_predecessor_gp_id
        - source_successor_gp_id
        - source_event_type
        - source_effective_on
        - succession_source_system

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: source_record_id, not_null: true}
      - {field: source_effective_on, not_null: true}
  - pattern: calculated_fields
    fields:
      - {name: succession_key, type: string, expression: "concat(source_predecessor_gp_id, ':', source_successor_gp_id)"}
  - pattern: data_enrichment
    lookups:
      - contract: investment.gp_conformed@1
        "on": {succession_source_system: gp_source_system, source_successor_gp_id: source_gp_id}
        fields: [gp_business_key, gp_normalised_name]
        no_match: null
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Every manager succession event, against the manager the estate resolved as the successor."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
