# The vault over the curated entity (architecture section 6, the data_vault
# row). The composition resolves the conformed records into one row per
# entity; the shape models that as hubs, satellites, a business-vault
# surviving record and a point-in-time relation, and the contract publishes
# every one of them (owner ruling R4). A consumer names the one it reads.
#
# The resolution is deterministic over three ranked keys. Two of the
# companies only two systems state carry neither identifier, so the
# normalised name is what merges them, and one pair of names that differ
# only in where the space falls merges for exactly that reason.
product:
  name: portfolio_company_vault
  domain: investment
  version: "1.0"
  layer: silver
  profile: integration
  owner: investment-domain

sources:
  - contract: investment.portfolio_company_conformed@1
    expect:
      fields:
        - source_record_id
        - source_company_id
        - source_fund_id
        - source_name
        - source_lei
        - source_external_id
        - source_sector
        - source_sub_sector
        - source_country
        - source_status
        - source_reported_on
        - company_source_system
        - company_identity_key
        - company_normalised_name
        - company_lei
        - company_external_id
        - company_business_key

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    stage: pre
    on_failure: abort
    rules:
      - {field: source_record_id, not_null: true}
      - {field: source_name, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: source_record_id, to: company_record_id, type: string}
      - {from: source_company_id, to: company_source_id, type: string}
      - {from: source_fund_id, to: company_fund_source_id, type: string}
      - {from: source_name, to: company_name, type: string}
      - {from: source_sector, to: company_sector, type: string}
      - {from: source_sub_sector, to: company_sub_sector, type: string}
      - {from: source_country, to: company_country, type: string}
      - {from: source_status, to: company_status, type: string}
      - {from: source_reported_on, to: company_reported_on, type: date}
      - {from: source_lei, drop: true}
      - {from: source_external_id, drop: true}
  - pattern: data_curation
    entity: portfolio_company
    resolution:
      strategy: deterministic
      keys: [company_lei, company_external_id, company_normalised_name]
      record_key: company_identity_key
      merge_iterations: 3
    survivorship:
      company_record_id: most_recent
      company_source_id: first_non_null
      company_source_system: most_recent
      company_identity_key: most_recent
      company_name: most_recent
      company_normalised_name: most_recent
      company_lei: first_non_null
      company_external_id: first_non_null
      company_business_key: first_non_null
      company_fund_source_id: most_recent
      company_sector: most_recent
      company_sub_sector: first_non_null
      company_country: first_non_null
      company_status: most_recent
      company_reported_on: most_recent
    precedence:
      source_column: company_source_system
      recency_column: company_reported_on
      source_priority: [vantora, chrono, meridex, portiq]
  - pattern: data_validation
    stage: post
    on_failure: abort
    rules:
      - {field: company_business_key, not_null: true}
      - {field: company_business_key, unique: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The portfolio company vault: identity, payload versions, the surviving record and the point-in-time relation over them."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: data_vault
  shape_config:
    hubs:
      - name: portfolio_company
        business_key: [company_business_key]
        description: "The portfolio company as the estate identifies one."
    satellites:
      - name: portfolio_company_detail
        kind: current
        parent: portfolio_company
        payload: [company_name, company_sector, company_sub_sector, company_country, company_lei, company_external_id]
        change_column: company_reported_on
        hashdiff_exclude: [company_sub_sector]
        description: "What the company is, versioned when any of it changes."
      - name: portfolio_company_observed
        kind: history
        parent: portfolio_company
        payload: [company_status, company_fund_source_id, company_sub_sector]
        change_column: company_reported_on
        hashdiff_exclude: [company_sub_sector]
        description: "Every delivered observation of the company's holding standing."
    business_vault:
      - name: portfolio_company
        hub: portfolio_company
        satellites: [portfolio_company_detail, portfolio_company_observed]
        attributes:
          - {name: company_name, strategy: most_recent}
          - {name: company_sector, strategy: most_recent}
          - {name: company_sub_sector, strategy: first_non_null}
          - {name: company_country, strategy: first_non_null}
          - {name: company_status, strategy: most_recent}
          - {name: company_lei, strategy: first_non_null}
          - {name: company_external_id, strategy: first_non_null}
        description: "One surviving record per portfolio company."
    point_in_time:
      - name: portfolio_company
        hub: portfolio_company
        satellites: [portfolio_company_detail, portfolio_company_observed]
        description: "Each company's satellites as they stood at every instant the vault stores."
  contract:
    freshness: "daily by 08:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
