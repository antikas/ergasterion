# The decision in force on each item: the latest decision event the log
# carries for it.
#
# The log appends, so an item that was deferred and later approved carries
# two events. Ranking the events of one item by when they were decided, and
# keeping the first rank, is what latest-wins means; the events it does not
# keep are excluded by a named predicate, so what was superseded is counted
# and logged rather than quietly dropped.
#
# A decision is final when it settles the item. Deferring it does not, so a
# deferred item is still waiting on somebody.
product:
  name: deal_decision_current
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.deal_decision_log@1
    expect:
      fields:
        - decision_id
        - external_deal_id
        - decision
        - conditions
        - actor
        - decided_at

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: decision_id, not_null: true}
      - {field: external_deal_id, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: decision_id, to: decision_id, type: string}
      - {from: external_deal_id, to: deal_external_identity, type: string}
      - {from: decision, to: decision_outcome, type: string}
      - {from: conditions, to: decision_conditions, type: string}
      - {from: actor, to: decision_actor, type: string}
      - {from: decided_at, to: decision_decided_at, type: timestamp}
  - pattern: calculated_fields
    fields:
      - {name: decision_rank, type: integer, expression: "row_number() over (partition by deal_external_identity order by decision_decided_at desc, decision_id desc)"}
      - {name: decision_is_final, type: boolean, expression: "decision_outcome in ('approve', 'approve_with_conditions', 'decline')"}
  - pattern: data_filtering
    predicates:
      - name: latest_decision_per_item_only
        expression: "decision_rank = 1"
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The decision in force on each item, with who decided it, when, and whether it settles the item."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
