# The consolidating product every lane of one entity meets in (architecture
# section 8, two or more non-landing product sources with a union
# composition and declared schema conformance across them). Every lane
# publishes the same schema, so the union needs no per-source conformance,
# and the coverage rule proves that every row every lane brought is still a
# row here.
#
# It is also where the business key is computed, once: the identifier the
# estate resolves the entity on, taken in the order the estate ranks them.
# One product owns that expression and every product downstream reads it.
#
# Coverage is proved here, by a declared reconcile rule against every lane
# this union combines, and by the known-answer assertions under
# tests/investment/ beside it. Every lane of an entity states a column some
# source system does not, and the coverage rule compares those null-safely,
# so a lane that never states a column is covered rather than reported
# missing on every row.
#
# A vehicle names the fund it belongs to by that source system's own
# fund identifier, so the fund the estate resolved is read here, on the
# system and identifier together, and travels with the vehicle from
# this point on.
product:
  name: legal_vehicle_conformed
  domain: investment
  version: "1.0"
  layer: silver
  profile: consolidation
  owner: investment-domain

sources:
  - contract: investment.meridex_legal_vehicle@1
    expect:
      fields:
        - source_record_id
        - source_vehicle_id
        - source_fund_id
        - source_parent_vehicle_id
        - source_name
        - source_vehicle_type
        - source_jurisdiction
        - source_incorporation_text
        - source_lei
        - source_incorporated_on
        - source_reported_on
        - vehicle_source_system
        - vehicle_identity_key
        - vehicle_normalised_name
        - vehicle_lei
  - contract: investment.vantora_legal_vehicle@1
    expect:
      fields:
        - source_record_id
        - source_vehicle_id
        - source_fund_id
        - source_parent_vehicle_id
        - source_name
        - source_vehicle_type
        - source_jurisdiction
        - source_incorporation_text
        - source_lei
        - source_incorporated_on
        - source_reported_on
        - vehicle_source_system
        - vehicle_identity_key
        - vehicle_normalised_name
        - vehicle_lei

combine:
  method: union

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: source_record_id, not_null: true}
      - {field: vehicle_identity_key, not_null: true}
      - reconcile:
          metric: row_count
          contracts: [investment.meridex_legal_vehicle@1, investment.vantora_legal_vehicle@1]
  - pattern: calculated_fields
    fields:
      - {name: vehicle_business_key, type: string, expression: "coalesce(vehicle_lei, vehicle_normalised_name)"}
  - pattern: data_enrichment
    lookups:
      - contract: investment.fund_conformed@1
        "on": {vehicle_source_system: fund_source_system, source_fund_id: source_fund_id}
        fields: [fund_business_key]
        no_match: null
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Every legal vehicle record both source systems state, under one schema, with the identifier the estate resolves it on."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
