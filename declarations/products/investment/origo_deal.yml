# The pipeline system's lane onto the deal schema. ORIGO is the only
# system that states deals, so the resolution downstream is within one
# source: two records are one deal when they carry the same external
# deal identifier, and the pairs no identifier merges are scored.
#
# A blank external identifier is read as nothing, so the two records
# that carry none stay separate rather than merging on an empty string.
product:
  name: origo_deal
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.origo_deal_extract@1
    expect:
      fields:
        - deal_id
        - external_deal_id
        - deal_name
        - target_entity_id
        - strategy
        - originating_team
        - sourced_date
        - converted_record_type
        - converted_record_id

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: deal_id, not_null: true}
      - {field: deal_name, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: deal_id, to: source_record_id, type: string}
      - {from: external_deal_id, to: source_external_deal_id, type: string}
      - {from: deal_name, to: source_name, type: string}
      - {from: target_entity_id, to: source_target_entity_id, type: string}
      - {from: strategy, to: source_strategy, type: string}
      - {from: originating_team, to: source_originating_team, type: string}
      - {from: source_channel, to: source_channel, type: string}
      - {from: sourced_date, to: source_sourced_on, type: date}
      - {from: structure, to: source_structure, type: string}
      - {from: converted_record_type, to: source_converted_record_type, type: string}
      - {from: converted_record_id, to: source_converted_record_id, type: string}
  - pattern: calculated_fields
    fields:
      - {name: deal_source_system, type: string, expression: "'origo'"}
      - {name: deal_identity_key, type: string, expression: "concat('origo', ':', source_record_id)"}
      - {name: deal_normalised_name, type: string, rule: investment_normalised_name_v1, rule_version: 1}
      - {name: deal_external_id, type: string, expression: "nullif(trim(source_external_deal_id), '')"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Deals as ORIGO states them, with the external deal identifier a blank is read out of."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
