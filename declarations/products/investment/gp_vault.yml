# The vault over the curated entity (architecture section 6, the data_vault
# row). The composition resolves the conformed records into one row per
# entity; the shape models that as hubs, satellites, a business-vault
# surviving record and a point-in-time relation, and the contract publishes
# every one of them (owner ruling R4). A consumer names the one it reads.
#
# The resolution is deterministic over three ranked keys: two managers
# are one when they share a legal entity identifier, the identifier the
# systems share, or a normalised name. Nothing here is scored, which is
# the difference between this product and the fund and deal vaults.
product:
  name: gp_vault
  domain: investment
  version: "1.0"
  layer: silver
  profile: integration
  owner: investment-domain

sources:
  - contract: investment.gp_conformed@1
    expect:
      fields:
        - source_record_id
        - source_gp_id
        - source_name
        - source_lei
        - source_external_id
        - source_domicile
        - source_relationship_start_date
        - source_reported_on
        - gp_source_system
        - gp_identity_key
        - gp_normalised_name
        - gp_lei
        - gp_external_id
        - gp_business_key

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    stage: pre
    on_failure: abort
    rules:
      - {field: source_record_id, not_null: true}
      - {field: source_name, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: source_record_id, to: gp_record_id, type: string}
      - {from: source_gp_id, to: gp_source_id, type: string}
      - {from: source_name, to: gp_name, type: string}
      - {from: source_domicile, to: gp_domicile, type: string}
      - {from: source_relationship_start_date, to: gp_relationship_start_on, type: date}
      - {from: source_reported_on, to: gp_reported_on, type: date}
      - {from: source_lei, drop: true}
      - {from: source_external_id, drop: true}
  - pattern: data_curation
    entity: gp
    resolution:
      strategy: deterministic
      keys: [gp_lei, gp_external_id, gp_normalised_name]
      record_key: gp_identity_key
      merge_iterations: 3
    survivorship:
      gp_record_id: most_recent
      gp_source_id: first_non_null
      gp_source_system: most_recent
      gp_identity_key: most_recent
      gp_name: most_recent
      gp_normalised_name: most_recent
      gp_lei: first_non_null
      gp_external_id: first_non_null
      gp_business_key: first_non_null
      gp_domicile: first_non_null
      gp_relationship_start_on: first_non_null
      gp_reported_on: most_recent
    precedence:
      source_column: gp_source_system
      recency_column: gp_reported_on
      source_priority: [vantora, chrono, meridex, portiq]
  - pattern: data_validation
    stage: post
    on_failure: abort
    rules:
      - {field: gp_business_key, not_null: true}
      - {field: gp_business_key, unique: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The manager vault: identity, payload versions, the surviving record and the point-in-time relation over them."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: data_vault
  shape_config:
    hubs:
      - name: gp
        business_key: [gp_business_key]
        description: "The manager as the estate identifies one."
    satellites:
      - name: gp_detail
        kind: current
        parent: gp
        payload: [gp_name, gp_domicile, gp_relationship_start_on, gp_lei, gp_source_id]
        change_column: gp_reported_on
        hashdiff_exclude: [gp_source_id]
        description: "What the manager is, versioned when any of it changes."
    business_vault:
      - name: gp
        hub: gp
        satellites: [gp_detail]
        attributes:
          - {name: gp_name, strategy: most_recent}
          - {name: gp_domicile, strategy: first_non_null}
          - {name: gp_relationship_start_on, strategy: first_non_null}
          - {name: gp_lei, strategy: first_non_null}
        description: "One surviving record per manager."
    point_in_time:
      - name: gp
        hub: gp
        satellites: [gp_detail]
        description: "Each manager's satellite as it stood at every instant the vault stores."
  contract:
    freshness: "daily by 08:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
