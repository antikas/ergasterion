# Landing product: The VANTORA book-of-record manager succession feed as it was delivered, one row per delivered succession event.
#
# The estate's `landed` label gives Batch Ingestion to the ingestion
# runtime and this relation, its validation, its publication and its retry
# wrapper to the SQL translator, so the relation is materialised from the
# delivered extract with no column changed (architecture section 5, the
# landing profile; owner ruling R1).
#
# Its schema has one origin: the relation it lands, bound here with the
# fields that relation delivers (owner ruling R5). Every column is a
# string, because a delivered extract states its values as text; the lane
# products downstream declare the types they need and cast to them. This
# is the only product that reads the delivered relation: nothing else in
# the estate does.
product:
  name: vantora_succession_event_extract
  domain: investment
  version: "1.0"
  layer: landed
  owner: investment-domain

sources:
  - contract: investment.vantora_succession_event_extract_delivery@1
    kind: fixture
    fixture:
      relation: raw_vantora_succession_events
      fields:
        - {name: succession_event_id, type: string}
        - {name: predecessor_gp_id, type: string}
        - {name: successor_gp_id, type: string}
        - {name: event_type, type: string}
        - {name: effective_date, type: string}
    expect:
      fields: [succession_event_id, predecessor_gp_id, successor_gp_id]

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: daily
    extract_mode: full
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: succession_event_id, not_null: true}
      - {field: succession_event_id, unique: true}
      - {field: predecessor_gp_id, not_null: true}
      - {field: successor_gp_id, not_null: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The VANTORA book-of-record manager succession feed as it was delivered, one row per delivered succession event."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 05:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
