# One source system's lane onto the schema the portfolio company products
# share, with the fund each system holds the company under.
product:
  name: chrono_portfolio_company
  domain: investment
  version: "1.0"
  layer: silver
  profile: derivation
  owner: investment-domain

sources:
  - contract: investment.chrono_portfolio_company_extract@1
    expect:
      fields:
        - asset_uid
        - vehicle_code
        - issuer_name_text
        - issuer_lei
        - vendor_company_id
        - first_reported_on

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: asset_uid, not_null: true}
      - {field: issuer_name_text, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: asset_uid, to: source_company_id, type: string}
      - {from: vehicle_code, to: source_fund_id, type: string}
      - {from: issuer_name_text, to: source_name, type: string}
      - {from: issuer_lei, to: source_lei, type: string}
      - {from: vendor_company_id, to: source_external_id, type: string}
      - {from: industry_group, to: source_sector, type: string}
      - {from: industry_detail, to: source_sub_sector, type: string}
      - {from: country_iso2, to: source_country, type: string}
      - {from: holding_status, to: source_status, type: string}
      - {from: first_reported_on, to: source_reported_on, type: date}
  - pattern: calculated_fields
    fields:
      - {name: source_record_id, type: string, expression: "source_company_id"}
      - {name: company_source_system, type: string, expression: "'chrono'"}
      - {name: company_identity_key, type: string, expression: "concat('chrono', ':', source_company_id)"}
      - {name: company_normalised_name, type: string, rule: investment_normalised_name_v1, rule_version: 1}
      - {name: company_lei, type: string, expression: "nullif(trim(source_lei), '')"}
      - {name: company_external_id, type: string, expression: "nullif(trim(source_external_id), '')"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Portfolio companies as CHRONO states them, on the schema the four company feeds share."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
