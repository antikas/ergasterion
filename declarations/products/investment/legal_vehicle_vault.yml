# The vault over the curated entity (architecture section 6, the data_vault
# row). The composition resolves the conformed records into one row per
# entity; the shape models that as hubs, satellites, a business-vault
# surviving record and a point-in-time relation, and the contract publishes
# every one of them (owner ruling R4). A consumer names the one it reads.
#
# The fund a vehicle belongs to is modelled inside the vault, as the fund
# vault models the manager it names: a hub for the fund and a link to it.
# The fund was resolved before the vehicle was curated, so the link is
# between two identities the estate agreed, not between two source ids.
#
# The resolution is deterministic over two ranked keys. One vehicle the
# two systems spell differently carries the same legal entity identifier
# and merges on it; one that neither system identifies merges on its
# normalised name; the incorporation date one system leaves blank
# survives from the system that states it.
product:
  name: legal_vehicle_vault
  domain: investment
  version: "1.0"
  layer: silver
  profile: integration
  owner: investment-domain

sources:
  - contract: investment.legal_vehicle_conformed@1
    expect:
      fields:
        - source_record_id
        - source_vehicle_id
        - source_fund_id
        - source_parent_vehicle_id
        - source_name
        - source_vehicle_type
        - source_jurisdiction
        - source_incorporation_text
        - source_lei
        - source_incorporated_on
        - source_reported_on
        - vehicle_source_system
        - vehicle_identity_key
        - vehicle_normalised_name
        - vehicle_lei
        - vehicle_business_key
        - fund_business_key

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    stage: pre
    on_failure: abort
    rules:
      - {field: source_record_id, not_null: true}
      - {field: source_name, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: source_record_id, to: vehicle_record_id, type: string}
      - {from: source_vehicle_id, to: vehicle_source_id, type: string}
      - {from: source_fund_id, to: vehicle_fund_source_id, type: string}
      - {from: source_parent_vehicle_id, to: vehicle_parent_source_id, type: string}
      - {from: source_name, to: vehicle_name, type: string}
      - {from: source_vehicle_type, to: vehicle_type, type: string}
      - {from: source_jurisdiction, to: vehicle_jurisdiction, type: string}
      - {from: source_incorporated_on, to: vehicle_incorporated_on, type: date}
      - {from: source_reported_on, to: vehicle_reported_on, type: date}
      - {from: fund_business_key, to: vehicle_fund_business_key, type: string}
      - {from: source_incorporation_text, drop: true}
      - {from: source_lei, drop: true}
  - pattern: data_curation
    entity: legal_vehicle
    resolution:
      strategy: deterministic
      keys: [vehicle_lei, vehicle_normalised_name]
      record_key: vehicle_identity_key
      merge_iterations: 2
    survivorship:
      vehicle_record_id: most_recent
      vehicle_source_id: first_non_null
      vehicle_source_system: most_recent
      vehicle_identity_key: most_recent
      vehicle_name: most_recent
      vehicle_normalised_name: most_recent
      vehicle_lei: first_non_null
      vehicle_business_key: first_non_null
      vehicle_fund_source_id: first_non_null
      vehicle_fund_business_key: first_non_null
      vehicle_parent_source_id: first_non_null
      vehicle_type: most_recent
      vehicle_jurisdiction: first_non_null
      vehicle_incorporated_on: first_non_null
      vehicle_reported_on: most_recent
    precedence:
      source_column: vehicle_source_system
      recency_column: vehicle_reported_on
      source_priority: [vantora, meridex]
  - pattern: data_validation
    stage: post
    on_failure: abort
    rules:
      - {field: vehicle_business_key, not_null: true}
      - {field: vehicle_business_key, unique: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The legal vehicle vault: identity, payload versions, the surviving record and the point-in-time relation over them."
    ownership: investment-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: data_vault
  shape_config:
    hubs:
      - name: legal_vehicle
        business_key: [vehicle_business_key]
        description: "The legal vehicle as the estate identifies one."
      - name: fund
        business_key: [vehicle_fund_business_key]
        description: "The fund a vehicle belongs to, as the estate identifies one."
    links:
      - name: legal_vehicle_fund
        hubs: [legal_vehicle, fund]
        description: "The fund a legal vehicle belongs to."
    satellites:
      - name: legal_vehicle_detail
        kind: current
        parent: legal_vehicle
        payload: [vehicle_name, vehicle_type, vehicle_jurisdiction, vehicle_incorporated_on, vehicle_lei, vehicle_fund_business_key, vehicle_fund_source_id, vehicle_parent_source_id]
        change_column: vehicle_reported_on
        hashdiff_exclude: [vehicle_fund_source_id, vehicle_parent_source_id]
        description: "What the vehicle is, versioned when any of it changes."
    business_vault:
      - name: legal_vehicle
        hub: legal_vehicle
        satellites: [legal_vehicle_detail]
        attributes:
          - {name: vehicle_name, strategy: most_recent}
          - {name: vehicle_type, strategy: most_recent}
          - {name: vehicle_jurisdiction, strategy: first_non_null}
          - {name: vehicle_incorporated_on, strategy: first_non_null}
          - {name: vehicle_fund_source_id, strategy: first_non_null}
          - {name: vehicle_parent_source_id, strategy: first_non_null}
          - {name: vehicle_lei, strategy: first_non_null}
          - {name: vehicle_fund_business_key, strategy: first_non_null}
        description: "One surviving record per legal vehicle."
    point_in_time:
      - name: legal_vehicle
        hub: legal_vehicle
        satellites: [legal_vehicle_detail]
        description: "Each vehicle's satellite as it stood at every instant the vault stores."
  contract:
    freshness: "daily by 08:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
