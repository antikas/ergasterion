# A canonical interface over one curated product: one relation per
# canonical entity, each a view at the declared interface boundary
# (declarations/targets/interfaces.yml, architecture section 6).
#
# Every column it publishes is named as the reference model names it. The
# reference block on each entity below records which published column
# carries which reference-model attribute, and validate-canonical proves it
# against the reference model checkout; this product is where the estate
# publishes that vocabulary, so a consumer reads the agreed name rather than
# one source system's spelling.
#
# The reference model identifies these entities by their external
# identifiers, so the identifier the estate resolved the entity on is
# published under that name.
product:
  name: fund_canonical
  domain: investment
  version: "1.0"
  layer: gold
  profile: serving
  owner: investment-domain

sources:
  - contract: investment.fund_vault@1
    relation: golden_fund
    expect:
      fields:
        - fund_hk
        - fund_business_key
        - fund_name
        - fund_asset_class
        - fund_strategy
        - fund_gp_business_key
        - fund_vintage_year
        - fund_committed_capital_usd
        - fund_status
        - fund_external_identity
        - fund_lei
        - fund_domicile
        - fund_currency
        - load_datetime
        - record_source

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: fund_business_key, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: fund_business_key, to: external_ids, type: string}
      - {from: fund_lei, to: lei, type: string}
      - {from: fund_name, to: fund_name, type: string}
      - {from: fund_gp_business_key, to: gp_id, type: string}
      - {from: fund_asset_class, to: asset_class, type: string}
      - {from: fund_strategy, to: strategy, type: string}
      - {from: fund_vintage_year, to: vintage_year, type: integer}
      - {from: fund_committed_capital_usd, to: committed_capital_usd, type: {name: decimal, precision: 18, scale: 2}}
      - {from: fund_currency, to: currency, type: string}
      - {from: fund_domicile, to: domicile, type: string}
      - {from: fund_status, to: fund_status, type: string}
      - {from: fund_hk, drop: true}
      - {from: fund_external_identity, drop: true}
      - {from: load_datetime, drop: true}
      - {from: record_source, drop: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The canonical fund interface, published under the reference model's own attribute names."
    ownership: investment-domain
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: canonical
  shape_config:
    entities:
      - name: fund
        key: [external_ids]
        columns: [external_ids, lei, fund_name, gp_id, asset_class, strategy, vintage_year, committed_capital_usd, currency, domicile, fund_status]
        description: "The fund as the reference model states one."
        # Which entity of the reference model this one is the estate's
        # reading of, and which of its attributes each column carries.
        # PM-01 Fund and Vehicle.
        reference:
          entity: PM-01
          attributes:
            external_ids: external_ids
            lei: lei
            fund_name: fund_name
            gp_id: gp_id
            asset_class: asset_class
            strategy: strategy
            vintage_year: vintage_year
            committed_capital_usd: committed_capital_usd
            currency: currency
            domicile: domicile
            fund_status: fund_status
      - name: fund_identity
        key: [external_ids]
        columns: [external_ids, lei, fund_name]
        description: "How the reference model identifies a fund: its external identifier, its legal entity identifier and the name it is known by."
        # Which entity of the reference model this one is the estate's
        # reading of, and which of its attributes each column carries.
        # PM-01 Fund and Vehicle.
        reference:
          entity: PM-01
          attributes:
            external_ids: external_ids
            lei: lei
            fund_name: fund_name
  contract:
    freshness: "daily by 09:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
