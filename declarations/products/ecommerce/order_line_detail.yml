# One row per order line with the article it ordered and the order it
# belongs to, merged on the order (architecture section 8, a consolidating
# product over a consolidating product and a curated one).
#
# This is the relation the served dimensional model is built from. A star
# is derived from one relation, so the relation has to carry every column
# the facts are cut from and every key the dimensions are joined by, and
# this is the generation that assembles it.
#
# Both sides are keyed by the order and every order has at least one line,
# so the merge matches throughout and this product publishes exactly the
# lines the estate took. The customer sits one join away rather than in
# this merge on purpose: a merge keeps every row of both sides, and the
# customer who has never ordered would arrive here with no line, no article
# and no order, which is not a row a relation of order lines can carry.
# That customer is published by the order to customer relationship product
# instead, which is the product whose subject they are.
product:
  name: order_line_detail
  domain: ecommerce
  version: "1.0"
  layer: silver
  profile: consolidation
  owner: ecommerce-domain

sources:
  - contract: ecommerce.order_line_product@1
    expect:
      fields:
        - order_id
        - order_line_record_id
        - line_number
        - line_quantity
        - line_unit_price
        - line_revenue
        - line_order_date
        - product_code
        - product_name
        - product_brand
        - product_category
        - product_list_price
        - product_as_of_date
  - contract: ecommerce.order@1
    expect:
      fields:
        - order_id
        - order_date
        - order_status
        - order_total
        - order_value_band
        - order_channel
        - customer_business_key
        - customer_external_id

combine:
  method: merge
  keys: [order_id]
  join: outer

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: order_id, not_null: true}
      - {field: customer_business_key, not_null: true}
      - reconcile:
          metric: row_count
          contracts: [ecommerce.order_line_product@1, ecommerce.order@1]
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "One row per order line with the article ordered and the order it belongs to."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 08:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
