# The canonical article interface: one relation per canonical entity over
# the curated article, a view at the declared interface boundary
# (declarations/targets/interfaces.yml, architecture section 6).
#
# One entity, because the estate agrees one thing about an article: what it
# is and what it lists for. The interface exists so a consumer reads the
# agreed form rather than the curated product's own working columns.
product:
  name: product_interface
  domain: ecommerce
  version: "1.0"
  layer: gold
  profile: serving
  owner: ecommerce-domain

sources:
  - contract: ecommerce.product@1
    expect:
      fields:
        - product_code
        - product_name
        - product_brand
        - product_category
        - product_list_price
        - product_currency
        - product_status

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: product_code, not_null: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The canonical article interface: the agreed form of every article the estate recognises."
    ownership: ecommerce-domain
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: canonical
  shape_config:
    entities:
      - name: product
        key: [product_code]
        columns: [product_code, product_name, product_brand, product_category, product_list_price, product_currency, product_status]
        description: "The article as the estate agrees it."
  contract:
    freshness: "daily by 09:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
