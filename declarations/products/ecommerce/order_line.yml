# Every order line both channels took, under one schema (architecture
# section 8, the consolidating generation: two or more non-landing product
# sources with a union composition and declared schema conformance).
#
# The two lanes state one schema between them, so no source needs a
# conformance mapping here and the union publishes that schema unchanged.
#
# The coverage a consolidated product proves against the contracts it
# consolidates is declared as a rule of its own: every line either channel
# brought is still a line here.
product:
  name: order_line
  domain: ecommerce
  version: "1.0"
  layer: silver
  profile: consolidation
  owner: ecommerce-domain

sources:
  - contract: ecommerce.cartivo_order_line@1
    expect:
      fields: &order_line_lane_fields
        - order_line_record_id
        - order_id
        - order_line_source_product_id
        - order_line_source_system
        - line_number
        - line_quantity
        - line_unit_price
        - line_revenue
        - line_currency
        - line_order_date
        - product_code
  - contract: ecommerce.mercaro_order_line@1
    expect:
      fields: *order_line_lane_fields

combine:
  method: union

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: order_line_record_id, not_null: true}
      - {field: order_id, not_null: true}
      - reconcile:
          metric: row_count
          contracts: [ecommerce.cartivo_order_line@1, ecommerce.mercaro_order_line@1]
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Every order line both channels took, one row per line, under one schema."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
