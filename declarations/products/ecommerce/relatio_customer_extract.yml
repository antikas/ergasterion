# Landing product: The contact system's customer extract as it was delivered. It covers only the customers that system holds, which is why the products downstream must survive an attribute it never states.
#
# The estate's `landed` label gives Batch Ingestion to the ingestion
# runtime and this relation, its validation, its publication and its retry
# wrapper to the SQL translator, so the relation is materialised from the
# delivered extract with no column changed (architecture section 5, the
# landing profile; owner ruling R1).
#
# Its schema has one origin: the relation it lands, bound here with the
# fields that relation delivers (owner ruling R5). Every column is a
# string, because a delivered extract states its values as text; the
# products downstream declare the types they need and cast to them. This
# is the only product that reads the delivered relation: nothing else in
# the estate does.
product:
  name: relatio_customer_extract
  domain: ecommerce
  version: "1.0"
  layer: landed
  owner: ecommerce-domain

sources:
  - contract: ecommerce.relatio_customer_extract_delivery@1
    kind: fixture
    fixture:
      relation: raw_relatio_customers
      fields:
        - {name: relatio_record_id, type: string}
        - {name: relatio_customer_id, type: string}
        - {name: loyalty_id, type: string}
        - {name: email, type: string}
        - {name: full_name, type: string}
        - {name: phone, type: string}
        - {name: address_line, type: string}
        - {name: city, type: string}
        - {name: postal_code, type: string}
        - {name: country, type: string}
        - {name: customer_status, type: string}
        - {name: as_of_date, type: string}
    expect:
      fields: [relatio_record_id, relatio_customer_id, loyalty_id]

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: daily
    extract_mode: full
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: relatio_record_id, not_null: true}
      - {field: relatio_record_id, unique: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The contact system's customer extract as it was delivered. It covers only the customers that system holds, which is why the products downstream must survive an attribute it never states."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 05:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
