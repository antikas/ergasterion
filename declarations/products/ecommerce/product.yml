# The curated article: one row per article the estate recognises, from the
# two catalogues that state articles, resolved and survived (architecture
# section 5, the integration profile).
#
# Both catalogues state the same shared product code for the same article,
# so resolution is deterministic on that one key and the two catalogue
# records of an article the estate sells through both channels become one.
#
# The two catalogues disagree about price, and they were extracted on
# different days. The declared survivorship is what settles that: the price
# and the status of the more recent extract survive, and the identifiers
# and descriptive text of the first catalogue that states them do.
product:
  name: product
  domain: ecommerce
  version: "1.0"
  layer: silver
  profile: integration
  owner: ecommerce-domain

sources:
  - contract: ecommerce.cartivo_product@1
    expect:
      fields: &product_lane_fields
        - source_record_id
        - source_product_id
        - source_system
        - product_code
        - product_name
        - brand
        - category
        - list_price
        - currency
        - product_status
        - as_of_date
  - contract: ecommerce.mercaro_product@1
    expect:
      fields: *product_lane_fields

combine:
  method: union

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    stage: pre
    on_failure: abort
    rules:
      - {field: source_record_id, not_null: true}
      - {field: product_code, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: source_record_id, to: product_record_id, type: string}
      - {from: source_product_id, to: product_source_id, type: string}
      - {from: source_system, to: product_source_system, type: string}
      - {from: brand, to: product_brand, type: string}
      - {from: category, to: product_category, type: string}
      - {from: list_price, to: product_list_price, type: {name: decimal, precision: 12, scale: 2}}
      - {from: currency, to: product_currency, type: string}
      - {from: as_of_date, to: product_as_of_date, type: date}
  - pattern: data_curation
    entity: product
    resolution:
      strategy: deterministic
      keys: [product_code]
      record_key: product_record_id
      merge_iterations: 2
    survivorship:
      product_record_id: most_recent
      product_source_id: most_recent
      product_source_system: most_recent
      product_code: first_non_null
      product_name: first_non_null
      product_brand: first_non_null
      product_category: first_non_null
      product_list_price: most_recent
      product_currency: most_recent
      product_status: most_recent
      product_as_of_date: most_recent
    precedence:
      source_column: product_source_system
      recency_column: product_as_of_date
      source_priority: [cartivo, mercaro]
  - pattern: data_validation
    stage: post
    on_failure: abort
    rules:
      - {field: product_code, unique: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "One row per article the estate recognises, with the surviving value of every attribute the catalogues state."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
