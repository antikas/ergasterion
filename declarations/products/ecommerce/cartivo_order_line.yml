# The storefront's order line lane onto the conformed schema.
#
# One source system's lane onto the conformed order line schema. Its
# columns are named for the line throughout, because two consolidating
# products put the line side by side with the order and with the article,
# and a merge never picks one of two columns carrying the same name.
#
# The shared product code is read from the same system's own article lane
# on the article identifier that system states, for the same reason the
# order lane reads its customer key: one system's line names one system's
# article, and the resolved article is a generation further on.
product:
  name: cartivo_order_line
  domain: ecommerce
  version: "1.0"
  layer: silver
  profile: derivation
  owner: ecommerce-domain

sources:
  - contract: ecommerce.cartivo_order_line_extract@1
    expect:
      fields:
        - cartivo_record_id
        - cartivo_order_id
        - cartivo_product_id
        - line_number
        - quantity
        - unit_price
        - line_revenue
        - currency
        - order_date

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - {field: cartivo_record_id, not_null: true}
      - {field: cartivo_order_id, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: cartivo_record_id, to: order_line_record_id, type: string}
      - {from: cartivo_order_id, to: order_id, type: string}
      - {from: cartivo_product_id, to: order_line_source_product_id, type: string}
      - {from: line_number, to: line_number, type: integer}
      - {from: quantity, to: line_quantity, type: integer}
      - {from: unit_price, to: line_unit_price, type: {name: decimal, precision: 12, scale: 2}}
      - {from: line_revenue, to: line_revenue, type: {name: decimal, precision: 12, scale: 2}}
      - {from: currency, to: line_currency, type: string}
      - {from: order_date, to: line_order_date, type: date}
  - pattern: calculated_fields
    fields:
      - {name: order_line_source_system, type: string, expression: "'cartivo'"}
  - pattern: data_enrichment
    lookups:
      - contract: ecommerce.cartivo_product@1
        "on": {order_line_source_product_id: source_product_id}
        fields: [product_code]
        no_match: null
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Order lines as the storefront states them, on the schema the two line feeds share, carrying the code of the article ordered."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
