# The curated order: one row per order the estate recognises, from the two
# channels that take orders (architecture section 5, the integration
# profile).
#
# The two channels number their orders in their own sequences and no order
# is ever placed twice, so resolution on the order identifier merges
# nothing here and every order stays its own record. That is the point of
# declaring it: the curation is the estate saying what an order is and how
# two records of one would be settled, not a step that only earns its place
# when duplicates happen to be present.
#
# Every order carries the business key of the customer that placed it,
# read one generation back inside its own channel, so the consolidating
# product that puts an order beside its customer has a key to merge on.
# On that key it then reads the customer identity the estate holds, which
# is what lets a product downstream ask which segment the customer sat in
# on the day of the order without joining the customer twice.
product:
  name: order
  domain: ecommerce
  version: "1.0"
  layer: silver
  profile: integration
  owner: ecommerce-domain

sources:
  - contract: ecommerce.cartivo_order@1
    expect:
      fields: &order_lane_fields
        - source_record_id
        - source_order_id
        - source_customer_id
        - source_system
        - order_date
        - order_status
        - currency
        - order_total
        - order_value_band
        - channel
        - customer_business_key
  - contract: ecommerce.mercaro_order@1
    expect:
      fields: *order_lane_fields

combine:
  method: union

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    stage: pre
    on_failure: abort
    rules:
      - {field: source_record_id, not_null: true}
      - {field: source_order_id, not_null: true}
  - pattern: schema_transform
    mapping:
      - {from: source_record_id, to: order_record_id, type: string}
      - {from: source_order_id, to: order_id, type: string}
      - {from: source_customer_id, to: order_source_customer_id, type: string}
      - {from: source_system, to: order_source_system, type: string}
      - {from: currency, to: order_currency, type: string}
      - {from: channel, to: order_channel, type: string}
  - pattern: data_enrichment
    lookups:
      - contract: ecommerce.customer@1
        "on": {customer_business_key: customer_business_key}
        fields: [customer_external_id]
        no_match: null
  - pattern: data_curation
    entity: order
    resolution:
      strategy: deterministic
      keys: [order_id]
      record_key: order_record_id
      merge_iterations: 2
    survivorship:
      order_record_id: most_recent
      order_id: first_non_null
      order_source_customer_id: most_recent
      order_source_system: most_recent
      order_date: most_recent
      order_status: most_recent
      order_currency: most_recent
      order_total: most_recent
      order_value_band: most_recent
      order_channel: most_recent
      customer_business_key: first_non_null
      customer_external_id: first_non_null
    precedence:
      source_column: order_source_system
      recency_column: order_date
      source_priority: [cartivo, mercaro]
  - pattern: data_validation
    stage: post
    on_failure: abort
    rules:
      - {field: order_id, unique: true}
      - {field: customer_business_key, not_null: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "One row per order the estate recognises, with the channel that took it and the key of the customer that placed it."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
