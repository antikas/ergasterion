source:
  name: meridex
  display_name: MERIDEX
  system: MERIDEX administrator statement feed
  priority: 20

# DESCRIPTIVE-ONLY: documents intended attribute lineage to the OpenIM canonical
# model for onboarding review. ergasterion/emit.py's validate_canonical_mappings checks
# every business_keys/attributes value for spelling and schema drift against the
# OpenIM canonical model (model_file below) on every emit. It does NOT generate or
# drive the canonical layer -- models/canonical/*.sql is hand-authored, not
# templated from this block.
canonical_mappings:
  fund:
    model_file: model/entities/specialisations/private-markets/PM-01-fund-and-vehicle.md
    business_keys: {source_fund_id: external_ids, lei: lei, shared_external_id: external_ids, fund_name: known_aliases}
    attributes: {fund_name: fund_name, gp_id: gp_id, asset_class: asset_class, strategy: strategy, vintage_year: vintage_year, currency: currency, domicile: domicile}
  gp:
    model_file: model/entities/specialisations/private-markets/PM-02-gp-management-company.md
    business_keys: {source_gp_id: external_ids, lei: lei, gp_name: known_aliases}
    attributes: {gp_name: gp_name, domicile: domicile}
  portfolio_company:
    model_file: model/entities/specialisations/private-markets/PM-04-portfolio-company.md
    business_keys: {source_company_id: external_ids, lei: lei, shared_external_id: external_ids, company_name: known_aliases}
    attributes: {company_name: company_name, sector: sector, country: country}
  cash_flow:
    model_file: model/entities/core/E-06-cash-flow-event.md
    business_keys: {cash_flow_id: cash_flow_id, source_fund_id: instrument_id}
    attributes: {cash_flow_date: cash_flow_date, cash_flow_type: cash_flow_type, direction: direction, amount_usd: amount, currency: currency, source_system: source}
  legal_vehicle:
    model_file: model/entities/specialisations/private-markets/PM-05-legal-vehicle.md
    business_keys: {vehicle_natural_id: vehicle_id, source_fund_id: investment_id}
    attributes: {vehicle_name: vehicle_name, vehicle_type: vehicle_type, jurisdiction: jurisdiction, incorporation_date: incorporation_date, lei: lei}

tables:
  funds:
    raw_model: raw_meridex_funds
    seed_tests:
      - {name: meridex_fund_id, data_tests: [unique, not_null]}
      - {name: fund_name, data_tests: [not_null]}
    model_tests:
      - {name: source_fund_id, data_tests: [unique, not_null]}
      - {name: fund_name, data_tests: [not_null]}
    projection:
      - {name: source_system, expression: "'meridex'"}
      - {name: source_fund_id, expression: "cast(meridex_fund_id as string)"}
      - {name: fund_name, expression: "cast(fund_name as string)"}
      - {name: gp_name, expression: "cast(gp_name as string)"}
      - {name: gp_lei, expression: "{{ blank_to_null('gp_lei') }}"}
      - {name: lei, expression: "{{ blank_to_null('fund_lei') }}"}
      - {name: shared_external_id, expression: "{{ blank_to_null('shared_external_id') }}"}
      - {name: asset_class, expression: "cast(asset_class as string)"}
      - {name: strategy, expression: "cast(strategy as string)"}
      - {name: vintage_year, expression: "{{ dpf_safe_cast('vintage_year', 'int') }}"}
      - {name: currency, expression: "cast(currency as string)"}
      - {name: domicile, expression: "cast(domicile as string)"}
    vault_entities:
      - name: funds
        entity: fund
        record_source: "!MERIDEX_FUNDS"
        bridge:
          resolutions:
            - {alias: fund_resolution, model: res_fund, join_type: inner, conditions: [fund_resolution.source_system = source.source_system, fund_resolution.source_id = source.source_fund_id]}
            - {alias: gp_resolution, model: res_gp, join_type: left, conditions: [gp_resolution.source_system = source.source_system, "gp_resolution.source_id = concat(source.source_fund_id, ':gp')"]}
          select:
            - {name: source_system, expression: source.source_system}
            - {name: source_record_id, expression: source.source_fund_id}
            - {name: source_fund_id, expression: source.source_fund_id}
            - {name: source_gp_id, expression: "concat(source.source_fund_id, ':gp')"}
            - {name: fund_name, expression: source.fund_name}
            - {name: fund_family_name, expression: "cast(null as string)"}
            - {name: vehicle_type, expression: "cast(null as string)"}
            - {name: gp_name, expression: source.gp_name}
            - {name: lei, expression: source.lei}
            - {name: shared_external_id, expression: source.shared_external_id}
            - {name: asset_class, expression: source.asset_class}
            - {name: strategy, expression: source.strategy}
            - {name: vintage_year, expression: source.vintage_year}
            - {name: committed_capital_usd, expression: "cast(null as numeric)"}
            - {name: currency, expression: source.currency}
            - {name: domicile, expression: source.domicile}
            - {name: fund_status, expression: "cast(null as string)"}
            - {name: as_of_date, expression: "cast(null as date)"}
            - {name: effective_from, expression: "cast(null as date)"}
            - {name: golden_fund_key, expression: fund_resolution.golden_fund_key}
            - {name: fund_resolution_tier, expression: fund_resolution.resolution_tier}
            - {name: fund_resolution_confidence, expression: fund_resolution.confidence}
            - {name: golden_gp_key, expression: gp_resolution.golden_gp_key}
            - {name: gp_resolution_tier, expression: gp_resolution.resolution_tier}
            - {name: gp_resolution_confidence, expression: gp_resolution.confidence}
          where: [fund_resolution.golden_fund_key is not null]
      - name: gps
        entity: gp
        source_model: stg_meridex_funds
        record_source: "!MERIDEX_GPS"
        bridge:
          resolutions:
            - {alias: gp_resolution, model: res_gp, join_type: inner, conditions: [gp_resolution.source_system = source.source_system, "gp_resolution.source_id = concat(source.source_fund_id, ':gp')"]}
          select:
            - {name: source_system, expression: source.source_system}
            - {name: source_gp_id, expression: "concat(source.source_fund_id, ':gp')"}
            - {name: source_fund_id, expression: source.source_fund_id}
            - {name: gp_name, expression: source.gp_name}
            - {name: lei, expression: source.gp_lei}
            - {name: shared_external_id, expression: "cast(null as string)"}
            - {name: domicile, expression: source.domicile}
            - {name: relationship_start_date, expression: "cast(null as date)"}
            - {name: effective_from, expression: "cast(null as date)"}
            - {name: golden_gp_key, expression: gp_resolution.golden_gp_key}
            - {name: gp_resolution_tier, expression: gp_resolution.resolution_tier}
            - {name: gp_resolution_confidence, expression: gp_resolution.confidence}
          where: [gp_resolution.golden_gp_key is not null]

  cash_flows:
    raw_model: raw_meridex_cash_flows
    seed_tests: [{name: cash_flow_id, data_tests: [unique, not_null]}]
    model_tests:
      - {name: cash_flow_id, data_tests: [unique, not_null]}
      - {name: source_fund_id, data_tests: [not_null]}
    projection:
      - {name: source_system, expression: "'meridex'"}
      - {name: cash_flow_id, expression: "cast(cash_flow_id as string)"}
      - {name: source_fund_id, expression: "cast(meridex_fund_id as string)"}
      - {name: cash_flow_date, expression: "{{ dpf_safe_cast('cash_flow_date', 'date') }}"}
      - {name: cash_flow_type, expression: "cast(cash_flow_type as string)"}
      - {name: direction, expression: "cast(direction as string)"}
      - {name: amount_usd, expression: "{{ dpf_safe_cast('amount_usd', 'numeric') }}"}
      - {name: currency, expression: "cast(currency as string)"}
    vault_entities:
      - name: cash_flows
        entity: fund_cash_flow
        record_source: "!MERIDEX_CASH_FLOWS"
        bridge:
          resolutions:
            - {alias: fund_resolution, model: res_fund, join_type: inner, conditions: [fund_resolution.source_system = source.source_system, fund_resolution.source_id = source.source_fund_id]}
          select:
            - {name: source_system, expression: source.source_system}
            - {name: cash_flow_id, expression: source.cash_flow_id}
            - {name: source_fund_id, expression: source.source_fund_id}
            - {name: cash_flow_date, expression: source.cash_flow_date}
            - {name: cash_flow_type, expression: source.cash_flow_type}
            - {name: direction, expression: source.direction}
            - {name: amount_usd, expression: source.amount_usd}
            - {name: currency, expression: source.currency}
            - {name: effective_from, expression: source.cash_flow_date}
            - {name: golden_fund_key, expression: fund_resolution.golden_fund_key}
            - {name: fund_resolution_tier, expression: fund_resolution.resolution_tier}
            - {name: fund_resolution_confidence, expression: fund_resolution.confidence}
          where: [fund_resolution.golden_fund_key is not null]

  fund_nav:
    raw_model: raw_meridex_fund_nav
    seed_tests: [{name: nav_id, data_tests: [unique, not_null]}]
    model_tests:
      - {name: valuation_id, data_tests: [unique, not_null]}
      - {name: source_fund_id, data_tests: [not_null]}
    projection:
      - {name: source_system, expression: "'meridex'"}
      - {name: valuation_id, expression: "cast(nav_id as string)"}
      - {name: source_fund_id, expression: "cast(meridex_fund_id as string)"}
      - {name: valuation_date, expression: "{{ dpf_safe_cast('nav_date', 'date') }}"}
      - {name: nav_usd, expression: "{{ dpf_safe_cast('nav_usd', 'numeric') }}"}
      - {name: called_capital_usd, expression: "{{ dpf_safe_cast('called_capital_usd', 'numeric') }}"}
      - {name: distributed_capital_usd, expression: "{{ dpf_safe_cast('distributed_capital_usd', 'numeric') }}"}
      - {name: method, expression: "'manager_mark'"}
      - {name: valuation_grain, expression: "'fund_nav'"}

  portfolio_companies:
    raw_model: raw_meridex_portfolio_companies
    seed_tests:
      - {name: meridex_company_id, data_tests: [unique, not_null]}
      - {name: company_name, data_tests: [not_null]}
    model_tests:
      - {name: source_company_id, data_tests: [unique, not_null]}
      - {name: company_name, data_tests: [not_null]}
    projection:
      - {name: source_system, expression: "'meridex'"}
      - {name: source_company_id, expression: "cast(meridex_company_id as string)"}
      - {name: source_fund_id, expression: "cast(meridex_fund_id as string)"}
      - {name: company_name, expression: "cast(company_name as string)"}
      - {name: lei, expression: "{{ blank_to_null('company_lei') }}"}
      - {name: shared_external_id, expression: "{{ blank_to_null('shared_external_id') }}"}
      - {name: sector, expression: "cast(sector as string)"}
      - {name: country, expression: "cast(country as string)"}
    vault_entities:
      - name: portfolio_companies
        entity: portfolio_company
        record_source: "!MERIDEX_PORTFOLIO_COMPANIES"
        bridge:
          resolutions:
            - {alias: company_resolution, model: res_portfolio_company, join_type: inner, conditions: [company_resolution.source_system = source.source_system, company_resolution.source_id = source.source_company_id]}
            - {alias: fund_resolution, model: res_fund, join_type: left, conditions: [fund_resolution.source_system = source.source_system, fund_resolution.source_id = source.source_fund_id]}
          select:
            - {name: source_system, expression: source.source_system}
            - {name: source_company_id, expression: source.source_company_id}
            - {name: source_fund_id, expression: source.source_fund_id}
            - {name: company_name, expression: source.company_name}
            - {name: lei, expression: source.lei}
            - {name: shared_external_id, expression: source.shared_external_id}
            - {name: sector, expression: source.sector}
            - {name: sub_sector, expression: "cast(null as string)"}
            - {name: country, expression: source.country}
            - {name: status, expression: "cast(null as string)"}
            - {name: first_seen_at, expression: "cast(null as date)"}
            - {name: effective_from, expression: "cast(null as date)"}
            - {name: golden_portfolio_company_key, expression: company_resolution.golden_portfolio_company_key}
            - {name: portfolio_company_resolution_tier, expression: company_resolution.resolution_tier}
            - {name: portfolio_company_resolution_confidence, expression: company_resolution.confidence}
            - {name: golden_fund_key, expression: fund_resolution.golden_fund_key}
            - {name: fund_resolution_tier, expression: fund_resolution.resolution_tier}
            - {name: fund_resolution_confidence, expression: fund_resolution.confidence}
          where: [company_resolution.golden_portfolio_company_key is not null]

  # SPV / legal-vehicle layer. MERIDEX carries the two shared Orion vehicles
  # with SUBTLE discrepancies against VANTORA (a re-spelt vehicle_name; a missing
  # incorporation_date) so first_non_null survivorship has a real winner to pick. No
  # entity_resolution branch for vehicles by design; res_fund resolves the parent fund.
  legal_vehicles:
    raw_model: raw_meridex_legal_vehicles
    seed_tests:
      - {name: vehicle_id, data_tests: [unique, not_null]}
      - {name: vehicle_name, data_tests: [not_null]}
    model_tests:
      - {name: vehicle_natural_id, data_tests: [unique, not_null]}
    projection:
      - {name: source_system, expression: "'meridex'"}
      - {name: vehicle_natural_id, expression: "cast(vehicle_id as string)"}
      - {name: source_fund_id, expression: "cast(meridex_fund_id as string)"}
      - {name: parent_vehicle_id, expression: "{{ blank_to_null('parent_vehicle_id') }}"}
      - {name: vehicle_name, expression: "cast(vehicle_name as string)"}
      - {name: vehicle_type, expression: "cast(vehicle_type as string)"}
      - {name: jurisdiction, expression: "cast(jurisdiction as string)"}
      - {name: incorporation_date, expression: "{{ dpf_safe_cast('incorporation_date', 'date') }}"}
      - {name: lei, expression: "{{ blank_to_null('vehicle_lei') }}"}
    vault_entities:
      - name: legal_vehicles
        entity: legal_vehicle
        record_source: "!MERIDEX_LEGAL_VEHICLES"
        bridge:
          resolutions:
            - {alias: fund_resolution, model: res_fund, join_type: inner, conditions: [fund_resolution.source_system = source.source_system, fund_resolution.source_id = source.source_fund_id]}
          select:
            - {name: vehicle_natural_id, expression: source.vehicle_natural_id}
            - {name: source_fund_id, expression: source.source_fund_id}
            - {name: parent_vehicle_id, expression: source.parent_vehicle_id}
            - {name: vehicle_name, expression: source.vehicle_name}
            - {name: vehicle_type, expression: source.vehicle_type}
            - {name: jurisdiction, expression: source.jurisdiction}
            - {name: incorporation_date, expression: source.incorporation_date}
            - {name: lei, expression: source.lei}
            - {name: effective_from, expression: source.incorporation_date}
            - {name: golden_legal_vehicle_key, expression: "{{ stable_golden_key('legal_vehicle', 'source.vehicle_natural_id') }}"}
            - {name: golden_fund_key, expression: fund_resolution.golden_fund_key}
          where: [fund_resolution.golden_fund_key is not null]

entity_resolution:
  fund:
    model: stg_meridex_funds
    columns:
      source_system: source_system
      source_id: source_fund_id
      source_record_id: source_fund_id
      fund_name: fund_name
      normalised_name: "{{ normalise_name('fund_name') }}"
      lei: lei
      shared_external_id: shared_external_id
      canonical_vantora_fund_id: "cast(null as string)"
      asset_class: asset_class
      strategy: strategy
      vintage_year: vintage_year
      currency: currency
  gp:
    model: stg_meridex_funds
    columns:
      source_system: source_system
      source_id: "concat(source_fund_id, ':gp')"
      gp_name: gp_name
      normalised_name: "{{ normalise_name('gp_name') }}"
      lei: gp_lei
      shared_external_id: "cast(null as string)"
      domicile: domicile
      relationship_start_date: "cast(null as date)"
  portfolio_company:
    model: stg_meridex_portfolio_companies
    columns:
      source_system: source_system
      source_id: source_company_id
      source_fund_id: source_fund_id
      company_name: company_name
      normalised_name: "{{ normalise_name('company_name') }}"
      lei: lei
      shared_external_id: shared_external_id
      sector: sector
      country: country
