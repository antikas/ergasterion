name: ergasterion
version: "0.1.0"
config-version: 2

profile: ergasterion

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

# Idempotent, Snowflake-only (no-op on every other target): creates the append-only
# entity_resolution_decisions_log table ONCE, if it does not already exist, so the
# Streamlit review-queue app has a relation to write analyst decisions into
# that no `dbt build`/`dbt seed`/`dbt run` truncates.
#
# deal_decision_log is the SAME pattern applied to the deal pipeline's
# investment-authorisation workflow, created through the SAME shared parameterised
# ensure-macro the ER log uses. Its three fixture decision rows live in the dbt seed
# seeds/deal_decision_log_fixtures.csv and are merged into the append-only log by the
# generic dpf_merge_seed_into_append_only_log post-hook on that seed. The MERGE is
# `when not matched then insert` only (keyed on decision_id), so it never duplicates or
# truncates on rebuild; the seed's depends_on edge on int_deal_latest_decision keeps the
# fixtures present before any consumer reads the log on a fresh build.
#
# See macros/entity_resolution_decisions.sql for the shared ensure-macro and the generic
# fixture-merge mechanism.
on-run-start:
  - "{{ dpf_ensure_er_decisions_schema() }}"
  - "{{ dpf_ensure_er_decisions_table() }}"
  - "{{ dpf_ensure_deal_decision_log_table() }}"

# Physical design rule (ergasterion/structure_gate.py enforces it): computation
# layers materialise as tables on every deployment target; a view is a
# one-deep interface artefact at a boundary declared in
# declarations/targets/interfaces.yml. Per-target structural budgets live
# beside that file, one declaration per adapter.
models:
  ergasterion:
    staging:
      +materialized: table
      +schema: staging
    entity_resolution:
      +materialized: table
      +schema: resolution
    deal_approvals:
      +materialized: table
      +schema: deal_approvals
    raw_vault:
      +schema: raw_vault
      stage:
        +materialized: table
        bridge:
          +materialized: table
      hubs:
        +materialized: incremental
      links:
        +materialized: incremental
      satellites:
        +materialized: incremental

