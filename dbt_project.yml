        full_name: string
        phone: string
        address_line: string
        city: string
        postal_code: string
        country: string
        customer_status: string
        as_of_date: string
    # Ground-truth customer identity manifest: the human-known TRUE customer
    # identity per source customer record. The reference estate lands it as the
    # reference.customer_overlap_manifest product and the resolution assertions
    # under tests/ecommerce/ read it from there.
    customer_er_overlap_manifest:
      +column_types:
        source_system: string
        source_record_id: string
        true_customer_external_id: string
        overlap_note: string
    # Seeded customer loyalty-tier / segment history. The reference estate lands it
    # as the reference.customer_segment_history product, which the dimensional
    # product's conformed segment dimension reads for point-in-time attribution.
    customer_segment_history_seed:
      +column_types:
        customer_external_id: string
        segment: string
        effective_from: string
        record_source: string
        load_datetime: string
    # Investment domain seeds. Every column is pinned to string; dates, amounts
