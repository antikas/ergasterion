name: ergasterion
version: "0.1.0"
config-version: 2

profile: ergasterion

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

# Idempotent (a no-op on an adapter the macro does not support): creates the
# append-only entity_resolution_decisions_log table ONCE, if it does not already
# exist, so a review surface has a relation to write analyst decisions into that
# no `dbt build`/`dbt seed`/`dbt run` truncates.
#
# deal_decision_log is the SAME pattern applied to an investment-authorisation
# workflow, created through the SAME shared parameterised ensure-macro the ER log
# uses. Its three fixture decision rows live in the dbt seed
# seeds/deal_decision_log_fixtures.csv and are merged into the append-only log by the
# generic dpf_merge_seed_into_append_only_log post-hook on that seed. The MERGE is
# `when not matched then insert` only (keyed on decision_id), so it never duplicates
# or truncates on rebuild.
#
# See macros/entity_resolution_decisions.sql for the shared ensure-macro and the generic
# fixture-merge mechanism.
on-run-start:
  - "{{ dpf_ensure_er_decisions_schema() }}"
  - "{{ dpf_ensure_er_decisions_table() }}"
  - "{{ dpf_ensure_deal_decision_log_table() }}"

# Physical design rule (ergasterion/structure_gate.py enforces it): computation
# materialises as a table on every deployment target; a view is either an
# interface artefact at a boundary declared in declarations/targets/interfaces.yml
# or a relation the product route registered as translator-private. Per-target
# structural budgets live beside that file, one declaration per adapter. The
# default below is the physical rule's own default; every model the product route
# writes carries its own explicit config and overrides it.
models:
  ergasterion:
    +materialized: table

seeds:
  ergasterion:
    +schema: raw
    +quote_columns: false
    # Deterministic decision fixtures, merged from
    # seeds/deal_decision_log_fixtures.csv into the append-only deal_decision_log by
    # the generic dpf_merge_seed_into_append_only_log post-hook below
    # (when-not-matched-insert, keyed on decision_id, so a rebuild never duplicates
    # or truncates). The append-only log itself is created at on-run-start and is
    # NEVER a dbt seed/model -- only this SEPARATE fixture-source seed is. It uses a
    # different relation name, deal_decision_log_fixtures, so
    # tests/assert_deal_decision_log_survives_rebuild.sql still forbids the log's own
    # name from being dbt-materialised. Pinned to string so the ids and the
    # timestamp/blank-conditions cells are never guessed; the merge casts each column
    # to its declared log type and maps a blank cell to null with blank_to_null.
    deal_decision_log_fixtures:
      +column_types:
        decision_id: string
        external_deal_id: string
        decision: string
        conditions: string
        actor: string
        decided_at: string
      +post-hook: "{{ dpf_merge_seed_into_append_only_log('deal_decision_log', this, 'decision_id', dpf_deal_decision_log_columns()) }}"
    # E-commerce customer-360 domain seeds. Every column is pinned to
    # string; dates/amounts/quantities are cast at each source's staging projection, and
    # blank cells (e.g. Ben's absent loyalty_id) map to null via blank_to_null, so
    # dbt's CSV type inference never guesses ids like
    # CART-CUST-001 / GTIN-1001 or a loyalty-blank column's type. All people are
    # synthetic, emails ride the reserved example.com domain (RFC 2606), addresses and
    # product/brand names are invented -- nothing resolvable to a real person or brand.
    raw_cartivo_customers:
      +column_types:
        cartivo_record_id: string
        cartivo_customer_id: string
        loyalty_id: string
        email: string
        full_name: string
        phone: string
        address_line: string
        city: string
        postal_code: string
        country: string
        marketing_consent: string
        preferred_channel: string
        customer_status: string
        as_of_date: string
    raw_cartivo_products:
      +column_types:
        cartivo_record_id: string
        cartivo_product_id: string
        shared_product_code: string
        product_name: string
        brand: string
        category: string
        list_price: string
        currency: string
        product_status: string
        as_of_date: string
    raw_cartivo_orders:
      +column_types:
        cartivo_record_id: string
        cartivo_order_id: string
        cartivo_customer_id: string
        order_date: string
        order_status: string
        currency: string
        order_total: string
        channel: string
    raw_cartivo_order_lines:
      +column_types:
        cartivo_record_id: string
        cartivo_order_id: string
        cartivo_product_id: string
        line_number: string
        quantity: string
        unit_price: string
        line_revenue: string
        currency: string
        order_date: string
    raw_mercaro_customers:
      +column_types:
        mercaro_record_id: string
        mercaro_customer_id: string
        loyalty_id: string
        email: string
        full_name: string
        city: string
