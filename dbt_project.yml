    # Ground-truth customer ER manifest: the human-known TRUE customer
    # identity per source customer record, used by
    # tests/assert_res_customer_er_precision_manifest.sql. A per-entity manifest, the
    # same precedent as entity_resolution_overlap_manifest (fund) and
