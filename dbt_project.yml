    # entity_resolution_overlap_manifest is the ground-truth overlap manifest
    # The human-known TRUE fund identity per source fund record, used
    # by tests/assert_res_fund_er_precision_overlap_manifest.sql (precision) and
    # tests/assert_res_fund_er_recall_overlap_manifest.sql (recall) to
    # assert ER correctness. Pinned to string so ids like SS-F-77 / PORTIQ-33 are
    # never guessed numeric by dbt's CSV type inference.
    entity_resolution_overlap_manifest:
      +column_types:
        source_system: string
        source_record_id: string
        true_fund_external_id: string
        overlap_note: string
    # ORIGO deal-origination CRM feed. Pinned to string (sourced_date is
    # cast at the staging projection, empty external/target/converted cells map to
    # null via blank_to_null) so ids like D-001 / ORIGO-EXT-DUP-A are never guessed by
    # dbt's CSV type inference.
    raw_origo_deals:
      +column_types:
        deal_id: string
        external_deal_id: string
        deal_name: string
        target_entity_id: string
        strategy: string
        originating_team: string
        source_channel: string
        sourced_date: string
        structure: string
        converted_record_type: string
        converted_record_id: string
    # Ground-truth deal ER manifest: the human-known TRUE deal identity per
    # ORIGO deal record, used by tests/assert_res_deal_er_precision_manifest.sql. A
    # SEPARATE seed from entity_resolution_overlap_manifest (which is res_fund-scoped);
    # the deal test is intra-source and must not overload the fund manifest.
    deal_er_overlap_manifest:
      +column_types:
        source_system: string
        source_record_id: string
        true_deal_external_id: string
        overlap_note: string
    # fund_invested_capital_basis is the per-fund invested-capital basis: the
    # recallable return-of-capital and fee-offset amounts that are subtracted from paid-in
    # to give invested capital, so MOIC has a basis distinct from TVPI's paid-in. A
    # read-time reference seed keyed by the fund business id, the same pattern as
    # hurdle_config; funds with no row here default to invested = paid-in (MOIC = TVPI).
    # Pinned to string (numerics cast in fact_fund_performance_base) so the amounts are
    # never guessed by dbt's CSV type inference.
    fund_invested_capital_basis:
      +column_types:
        fund_external_id: string
        recallable_distributions_usd: string
        fee_offset_usd: string
        basis_note: string
    classification_type:
      +column_types:
        classification_type_code: string
        classification_type_name: string
        description: string
    classification_value:
      +column_types:
        classification_type_code: string
        classification_value_code: string
        classification_value_name: string
        sort_order: string
        is_unknown: string
    investment_classification_history_seed:
      +column_types:
        entity_type: string
        entity_external_id: string
        classification_type_code: string
        classification_value_code: string
        effective_from: string
        record_source: string
        load_datetime: string
    # Deal-stage history seed: reuses the classification_type/value
    # reference pair as a third instance of the pattern (DEAL_STAGE alongside
    # DEPT/SECTOR) but keys directly on the deal's own external_deal_id -- deals are
    # single-source ORIGO with their own golden keys, so this does NOT go through
    # canonical_fund.shared_external_id. Pinned to string so ids like
    # ORIGO-EXT-DUP-A are never guessed by dbt's CSV type inference.
    #
    # stage_recorded_at orders same-day stage transitions. Rows without an authored
    # intraday time use midnight of effective_from. The ORIGO-EXT-004 DILIGENCE and
    # SCREENING rows exercise the tie. dim_deal_stage.sql and its point-in-time test
    # order on (effective_from, stage_recorded_at, <surrogate key>).
    deal_stage_history_seed:
      +column_types:
        entity_type: string
        entity_external_id: string
        classification_type_code: string
        classification_value_code: string
        effective_from: string
        record_source: string
        load_datetime: string
        stage_recorded_at: string
    # Deterministic investment-authorisation fixtures are merged from
    # seeds/deal_decision_log_fixtures.csv into the
    # append-only deal_decision_log by the generic dpf_merge_seed_into_append_only_log
    # post-hook below (Snowflake-only; when-not-matched-insert, keyed on decision_id, so
    # a rebuild never duplicates or truncates). The append-only log itself is created at
    # on-run-start and is NEVER a dbt seed/model -- only this SEPARATE fixture-source seed
    # is. It uses a different relation name, deal_decision_log_fixtures, so the survival
    # test still forbids the log's own name from being dbt-materialised.
    # Pinned to string so ids like DEC-ORIGO-EXT-DUP-B-01 and the timestamp/blank-conditions
    # cells are never guessed; the merge casts each column to its declared log type and maps
    # a blank cell to null with blank_to_null.
    #
    # Why these particular rows (the fixture stories they encode for the named tests):
    #   ORIGO-EXT-DUP-B -- the deal deal_stage_history_seed leaves sitting at DECISION with
    #     no terminal stage. The IC first deferred (2025-05-10), then reconvened and approved
    #     with conditions (2025-05-20). Latest-wins (decided_at desc) picks the later
    #     approve_with_conditions row over the earlier defer -- the dedup test
    #     (tests/assert_deal_latest_decision_dedup.sql) asserts exactly this -- and derives
    #     DUP-B's next stage (COMMITTED), so it drops OUT of deal_approval_queue once resolved.
    #   ORIGO-EXT-001 -- carries a seeded DECISION row (2025-03-10). The IC deferred it
    #     (2025-03-20) and has not reconvened; defer is non-terminal
    #     (int_deal_stage_from_decision derives no row), so it stays visible in
    #     deal_approval_queue, deferred and pending -- the positive queue-coverage row the
    #     queue model's schema tests bite on.
    deal_decision_log_fixtures:
      +column_types:
        decision_id: string
        external_deal_id: string
        decision: string
        conditions: string
        actor: string
        decided_at: string
      +post-hook: "{{ dpf_merge_seed_into_append_only_log('deal_decision_log', this, 'decision_id', dpf_deal_decision_log_columns()) }}"
    # E-commerce customer-360 domain seeds. Every column is pinned to
    # string; dates/amounts/quantities are cast at each source's staging projection, and
    # blank cells (e.g. Ben's absent loyalty_id) map to null via blank_to_null, so
    # dbt's CSV type inference never guesses ids like
    # CART-CUST-001 / GTIN-1001 or a loyalty-blank column's type. All people are
    # synthetic, emails ride the reserved example.com domain (RFC 2606), addresses and
    # product/brand names are invented -- nothing resolvable to a real person or brand.
    raw_cartivo_customers:
