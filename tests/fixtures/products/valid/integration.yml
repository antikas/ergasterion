# The "integration" profile via the "silver" layer label, which estate.yml
# maps to three profiles -- "profile" must be named. Matches architecture
# section 3.1's own worked composition example: pre-stage validation,
# schema_transform, calculated_fields (an inline SQL expression -- neutrality
# gate + neutral scalar type -- plus the one estate-enabled structured type,
# "array"), data_enrichment, data_curation, then post-stage validation.
# data_validation occurs twice with distinct stages (pre/post): architecture
# section 2 "a product may use a pattern more than once, for example
# validation before and after transformation"; section 5 "the stages a
# repeated pattern may take".
product:
  name: customer
  domain: ecommerce
  version: "1.0"
  layer: silver
  profile: integration
  owner: ecommerce-domain

sources:
  - contract: ecommerce.crm_customer_landing@1
    expect:
      fields: [customer_id, email, status_code]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    stage: pre
    rules:
      - field: customer_id
        completeness: 1.0
  - pattern: schema_transform
    mapping:
      - {from: cust_nm, to: customer_name, type: string}
      - {from: crtd_dt, to: created_on, type: date}
      - {from: tag_list, to: tags, type: {name: array}}
  - pattern: calculated_fields
    fields:
      - {name: is_active, type: boolean, expression: "status_code IN ('A', 'P')"}
  - pattern: data_enrichment
    lookups:
      - contract: ecommerce.customer_segment@1
        "on": {segment_code: segment_code}
        fields: [segment_name]
        no_match: null
  - pattern: data_curation
    entity: customer
    resolution:
      strategy: deterministic
      keys: [customer_id]
    survivorship:
      email: first_non_null
  - pattern: data_validation
    stage: post
    rules:
      - field: customer_id
        unique: true
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Curated customer entity."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
