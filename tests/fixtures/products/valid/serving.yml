# The "serving" profile via the "gold" layer label, which estate.yml maps to
# exactly one profile -- no "profile" key is needed, same as landing/bronze.
product:
  name: customer_mart
  domain: ecommerce
  version: "1.0"
  layer: gold
  owner: ecommerce-domain

sources:
  - contract: ecommerce.customer_360@1
    expect:
      fields: [customer_id, is_active]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    rules:
      - field: customer_id
        not_null: true
  - pattern: data_filtering
    predicates:
      - name: active_only
        expression: "is_active = true"
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Served customer mart."
    ownership: ecommerce-domain
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
