# RED CASE: profile_required. Based on valid/integration.yml, with the
# 'profile' key removed -- the 'silver' label admits three profiles
# (integration, derivation, consolidation), so the product must name one.
# Must fail closed naming the product, the label and the profile
# ("profile_required").
product:
  name: customer
  domain: ecommerce
  version: "1.0"
  layer: silver
  owner: ecommerce-domain

sources:
  - contract: ecommerce.crm_customer_landing@1
    expect:
      fields: [customer_id, email, status_code]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    stage: pre
    rules:
      - field: customer_id
        completeness: 1.0
  - pattern: schema_transform
    mapping:
      - {from: cust_nm, to: customer_name, type: string}
      - {from: crtd_dt, to: created_on, type: date}
      - {from: tag_list, to: tags, type: {name: array}}
  - pattern: calculated_fields
    fields:
      - {name: is_active, type: boolean, expression: "status_code IN ('A', 'P')"}
  - pattern: data_curation
    entity: customer
    resolution:
      strategy: deterministic
      keys: [customer_id]
    survivorship:
      email: first_non_null
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Curated customer entity."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
