# RED CASE: neutrality_marker_in_step_field. Based on valid/landing.yml,
# with a Jinja/dbt tag injected into metadata_capture's 'description' --
# inside 'steps', but not a key named 'expression'. The neutrality gate
# walks every string leaf of the whole document (architecture section 3.4,
# check 7), so this must still fail closed naming the product, the JSON
# path and the rule "neutrality_violation".
product:
  name: crm_customer_landing
  domain: ecommerce
  version: "1.0"
  layer: bronze
  owner: ecommerce-domain

# A landing product has no upstream contract to consume: its external system
# is referenced by batch_ingestion's own configuration (scope/cadence/extract
# mode only -- a connection reference is a runtime binding, outside every
# product declaration, owner ruling R1), never by a top-level source.
sources: []

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: daily
    extract_mode: full
  - pattern: data_validation
    rules:
      - field: customer_id
        not_null: true
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "{{ ref('crm_customer_extract') }}"
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
