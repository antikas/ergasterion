# RED CASE: neutrality_marker_in_product_owner. Based on valid/landing.yml,
# with a URL scheme injected into product.owner -- entirely outside 'steps'
# and nowhere near a key named 'expression'. The neutrality gate walks
# every string leaf of the whole document (architecture section 3.4, check
# 7), so this must still fail closed naming the product, the JSON path
# ("product.owner") and the rule "neutrality_violation".
product:
  name: crm_customer_landing
  domain: ecommerce
  version: "1.0"
  layer: bronze
  owner: "https://intranet/team"

# A landing product has no upstream contract to consume: its external system
# is referenced by batch_ingestion's own configuration (scope/cadence/extract
# mode only -- a connection reference is a runtime binding, outside every
# product declaration, owner ruling R1), never by a top-level source.
sources: []

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: daily
    extract_mode: full
  - pattern: data_validation
    rules:
      - field: customer_id
        not_null: true
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Landing copy of the CRM customer extract, unchanged."
    ownership: ecommerce-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
