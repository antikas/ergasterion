# The delivered customer feed: one row per delivered customer record, from
# two source systems. Its source is bound to a fixture relation for local
# proof (architecture section 12): no product in this estate publishes
# crm.customer_deliveries, so the binding carries the fields that relation
# delivers.
#
# The seeded population is what makes the known answers known:
#   * R-01 and R-02 are the same customer (C-001) delivered by two source
#     systems on one date; the billing record carries no email, so the
#     curated record's email survives from the crm one;
#   * R-03 is a second customer (C-002), delivered once.
product:
  name: customer_feed
  domain: crm
  version: "1.0"
  layer: delivered
  profile: serving
  owner: crm-domain

sources:
  - contract: crm.customer_deliveries@1
    kind: fixture
    fixture:
      relation: customer_records
      fields:
        - {name: rec_id, type: string}
        - {name: src_sys, type: string}
        - {name: cust_ref, type: string}
        - {name: nm, type: string}
        - {name: pcode, type: string}
        - {name: eml, type: string}
        - {name: status, type: string}
        - {name: pts, type: integer}
        - {name: eff_dt, type: date}
    expect:
      fields: [rec_id, src_sys, cust_ref, nm, pcode, eml, status, pts, eff_dt]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - field: rec_id
        not_null: true
      - field: cust_ref
        not_null: true
  - pattern: schema_transform
    mapping:
      - {from: rec_id, to: record_id, type: string}
      - {from: src_sys, to: source_system, type: string}
      - {from: cust_ref, to: customer_ref, type: string}
      - {from: nm, to: full_name, type: string}
      - {from: pcode, to: postcode, type: string}
      - {from: eml, to: email, type: string}
      - {from: status, to: customer_status, type: string}
      - {from: pts, to: loyalty_points, type: integer}
      - {from: eff_dt, to: effective_from, type: date}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "One row per delivered customer record, from every source system that delivers one."
    ownership: crm-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 05:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
