# A consolidation over a Data Vault relation and a delivered feed: the
# customer identity store beside the accounts the estate was delivered,
# their columns side by side on the customer reference both of them carry.
#
# It is here for what a vault relation publishes. A hub publishes its hash
# key, its business key, its load instant and its record source, and every
# one of them is required. A merge that keeps a row from one side with
# nothing from the other therefore has to say so: this one declares an
# outer join, so the contract publishes the columns inherited from the hub
# as optional and the compliance check and the contract agree about the
# unmatched rows. An inner merge over the same sources keeps only the
# customers both sides carry, and every column stays as required as the
# source it came from.
#
# Known answers on the seeded feeds: two customers are delivered and
# survive curation, and three accounts are delivered, one of them for a
# customer reference no delivery carries. The outer merge therefore
# publishes three rows, the third carrying the account and nothing from the
# hub.
product:
  name: customer_account_register
  domain: crm
  version: "1.0"
  layer: combined
  profile: consolidation
  owner: crm-domain

sources:
  - contract: crm.customer_vault@1
    relation: hub_customer
    expect:
      fields: [customer_hk, customer_ref, load_datetime, record_source]
  - contract: crm.account_feed@1
    expect:
      fields: [customer_ref, account_ref]

combine:
  method: merge
  keys: [customer_ref]
  join: outer

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - field: customer_ref
        not_null: true
      # The coverage a consolidated product proves against the contracts it
      # consolidates: every customer reference either side brought is still
      # a row here.
      - reconcile:
          metric: row_count
          contracts: [crm.customer_vault@1, crm.account_feed@1]
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Each delivered account beside the vault identity of the customer that holds it."
    ownership: crm-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
