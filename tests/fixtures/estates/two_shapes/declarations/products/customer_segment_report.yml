# A consumer of one entity view of the canonical interface, named on the
# source as the interface's own shape names it (architecture section 7).
# The interface publishes one relation per canonical entity; this product
# reads the segmentation entity, so the columns of the sibling entity view
# are not columns here.
#
# Known answers on the seeded feed: two curated customers, so two rows,
# both in the premium segment.
product:
  name: customer_segment_report
  domain: crm
  version: "1.0"
  layer: published
  profile: serving
  owner: crm-domain

sources:
  - contract: crm.customer_interface@1
    relation: customer_segmentation
    expect:
      fields: [customer_id, customer_segment, changed_at]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - field: customer_id
        not_null: true
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The segment each curated customer sits in, read from the canonical segmentation entity."
    ownership: crm-domain
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 09:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
