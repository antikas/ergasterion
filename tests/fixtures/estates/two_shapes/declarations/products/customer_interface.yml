# The canonical interface over the curated customer product: one relation
# per canonical entity, each a view at the declared interface boundary
# (declarations/targets/interfaces.yml).
#
# Its upstream is a curated product, which the canonical shape requires:
# an interface publishes the agreed form of an entity something already
# resolved.
#
# Known answers: two customers curated upstream, so each entity view
# carries two rows, one per customer identifier.
product:
  name: customer_interface
  domain: crm
  version: "1.0"
  layer: published
  profile: serving
  owner: crm-domain

sources:
  - contract: crm.customer@1
    expect:
      fields: [customer_id, customer_name, customer_segment, changed_at]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - field: customer_id
        not_null: true
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The canonical customer interface: one relation per entity over the curated customer product."
    ownership: crm-domain
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: canonical
  shape_config:
    entities:
      - name: customer
        key: [customer_id]
        columns: [customer_id, customer_name]
        description: "The customer as the estate agrees it."
        # Which entity of the external reference model this one is the
        # estate's reading of, and which of its attributes each column
        # carries. The entity is named by its identifier there, never by a
        # file path; `ergasterion validate-canonical` proves the mapping
        # against a checkout of that model.
        reference:
          entity: E-01
          attributes:
            customer_id: entity_id
            customer_name: entity_name
      - name: customer_segmentation
        key: [customer_id]
        columns: [customer_id, customer_segment, changed_at]
        description: "The segment each customer sits in, and when it last changed."
  contract:
    freshness: "daily by 08:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
