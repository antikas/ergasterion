# Landing product, generation "landing": the estate's orders enter here.
product:
  name: orders_landing
  domain: retail
  version: "1.0"
  layer: landed
  owner: retail-domain

sources: []

steps:
  - pattern: batch_ingestion
    scope: full
    cadence: hourly
    extract_mode: incremental
  - pattern: data_validation
    rules:
      - field: order_id
        not_null: true
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Landing copy of the order extract, unchanged."
    ownership: retail-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "hourly"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
