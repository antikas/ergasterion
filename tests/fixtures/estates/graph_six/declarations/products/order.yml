# Integration product, generation "first": its one source contract is
# published by a landing product. Its enrichment lookup reads a second
# landing product's contract, which is a graph edge but not a source edge,
# so it does not change the generation.
#
# Field lineage comes from three of this composition's occurrences: the
# schema_transform mapping, the inline expression of the calculated field
# (the columns the parser resolves), and the enrichment lookup's fields.
product:
  name: order
  domain: retail
  version: "1.0"
  layer: shaped
  profile: integration
  owner: retail-domain

sources:
  - contract: retail.orders_landing@1
    expect:
      fields: [order_id, status_code]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    stage: pre
    rules:
      - field: order_id
        completeness: 1.0
  - pattern: schema_transform
    mapping:
      - {from: ordr_dt, to: ordered_on, type: date}
      - {from: cust_id, to: customer_id, type: string}
      - {from: ordr_ttl, to: order_total, type: {name: decimal, precision: 12, scale: 2}}
      - {from: tag_list, to: tags, type: {name: array}}
  - pattern: calculated_fields
    fields:
      - {name: is_open, type: boolean, expression: "status_code IN ('N', 'P')"}
  - pattern: data_enrichment
    lookups:
      - contract: retail.catalogue_landing@1
        "on": {sku: sku}
        fields: [category_name]
        no_match: null
  - pattern: data_curation
    entity: order
    resolution:
      strategy: deterministic
      keys: [order_id]
    survivorship:
      order_total: most_recent
  - pattern: data_validation
    stage: post
    rules:
      - field: order_id
        unique: true
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Conformed order entity."
    ownership: retail-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "hourly"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
