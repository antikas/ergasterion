# Derivation product, generation "first": its one source contract is
# published by a landing product. Its calculated field takes the named-rule
# route rather than the inline-expression one, so its field lineage records
# the rule and version the field is computed by.
product:
  name: product_catalogue
  domain: retail
  version: "1.0"
  layer: shaped
  profile: derivation
  owner: retail-domain

sources:
  - contract: retail.catalogue_landing@1
    expect:
      fields: [sku]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    rules:
      - field: sku
        not_null: true
  - pattern: calculated_fields
    fields:
      - name: margin_band
        type: string
        rule: margin_band_v1
        rule_version: 1
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Derived catalogue attributes."
    ownership: retail-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 06:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
