# The other consolidating shape: two products' columns side by side on a
# declared key, rather than their rows stacked. Both sources read one
# source system's customers, so neither brings a column the other brings,
# and the key is carried by both.
#
# The merge declares an outer join, so it keeps every row of both sides: a
# customer the activity feed knows and the first system does not still
# appears, with the key coalesced across the two sides and the columns only
# the other side carries left empty. That row is this product's known
# answer, and it is why the contract publishes every column inherited from
# a side that can be unmatched as optional.
product:
  name: customer_master
  domain: crm
  version: "1.0"
  layer: shaped
  profile: consolidation
  owner: crm-domain

sources:
  - contract: crm.customer_a@1
    expect:
      fields: [customer_id, email, lifetime_value]
  - contract: crm.customer_flags@1
    expect:
      fields: [customer_id, is_active, is_dormant]

combine:
  method: merge
  keys: [customer_id]
  join: outer

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - field: customer_id
        not_null: true
      # The same coverage, proved on the key the columns were merged on:
      # every customer either side brought is still a row here.
      - reconcile:
          metric: row_count
          contracts: [crm.customer_a@1, crm.customer_flags@1]
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Each customer of the first source system beside its activity flags."
    ownership: crm-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
  checkpoint: true
