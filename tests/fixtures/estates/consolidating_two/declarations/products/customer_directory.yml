# The consumer of the union. What it can expect of that contract is what
# the union publishes: the conformed schema, and nothing of either feed's
# own column names. It narrows that schema to the three columns a directory
# needs.
product:
  name: customer_directory
  domain: crm
  version: "1.0"
  layer: served
  owner: crm-domain

sources:
  - contract: crm.customer_union@1
    expect:
      fields: [customer_id, email, lifetime_value]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - field: customer_id
        not_null: true
  - pattern: schema_transform
    mapping:
      - {from: signed_up_on, drop: true}
      - {from: source_system, drop: true}
      - {from: loyalty_tier, drop: true}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Every customer of both source systems, with the value of each."
    ownership: crm-domain
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 08:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: composition
  max_retries: 1
  backoff: none
