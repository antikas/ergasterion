# The consolidating product this estate exists for: one customer entity
# from two source systems, their rows stacked under one conformed schema
# (architecture section 8, "two or more non-landing product sources, with a
# union or merge composition and declared schema conformance").
#
# The first source's fields are the schema the union publishes. The second
# source states the same four facts under its own names and states its
# lifetime value as a whole number, so its source carries the conformance
# that renames each and casts the value to the type the schema declares.
# The cast goes through the adapter's own type mapping, so the built
# relation carries the declared type on whichever adapter compiles it.
#
# Its fifth column, source_system, arrives from both lanes under the same
# name and needs no conformance: it is what makes the union's known answer
# countable per feed.
#
# Its sixth, loyalty_tier, is stated by the first lane and by no row of the
# second. That is what makes the coverage proof below a real one: a lane
# that never states a column brings it empty, and a coverage rule comparing
# it with plain equality would report every row of that lane as missing
# while all of them are here.
#
# The second lane also states its columns in its own order. A union stacks
# rows, and rows are matched by position, so every source is read in the
# order the published schema states, never in the order its own relation
# carries.
product:
  name: customer_union
  domain: crm
  version: "1.0"
  layer: shaped
  profile: consolidation
  owner: crm-domain

sources:
  - contract: crm.customer_a@1
    expect:
      fields: [customer_id, email, signed_up_on, lifetime_value, source_system, loyalty_tier]
  - contract: crm.customer_b@1
    expect:
      fields: [cust_ref, ltv, email_address, signup_date, source_system, loyalty_tier]
    conform:
      mapping:
        - {from: cust_ref, to: customer_id, type: string}
        - {from: email_address, to: email, type: string}
        - {from: signup_date, to: signed_up_on, type: date}
        - {from: ltv, to: lifetime_value, type: {name: decimal, precision: 12, scale: 2}}

combine:
  method: union

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - field: customer_id
        not_null: true
      # The coverage a consolidated product proves against the contracts it
      # consolidates (architecture section 8): every row both lanes brought
      # is still here, proved by the schema the union publishes.
      - reconcile:
          metric: row_count
          contracts: [crm.customer_a@1, crm.customer_b@1]
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "Every customer of both source systems, under one schema."
    ownership: crm-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 07:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 3
  backoff: exponential
  checkpoint: true
