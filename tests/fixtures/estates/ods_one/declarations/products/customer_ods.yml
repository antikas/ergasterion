# The operational data store product: the delivered change events reshaped
# into entity relations with declared keys and effectivity, a
# cross-reference relation and an audit tail (architecture section 6). The
# shape adds no constraint of its own; it reads the entity key, the source
# system, the source key, the change timestamp and the operation the
# delivered feed already carries.
#
# Known answers on the seeded feed:
#   * two entities survive: E-001 (three raw events, two source keys)
#     and E-002 (three raw events, two source keys, one of them
#     re-pointed from E-001 by its latest event);
#   * the entity relation carries three adjacent, half-open versions for
#     E-001 and two for E-002, the last version of each open;
#   * the cross-reference relation carries one row per distinct source
#     key -- four rows -- resolved to the entity each key's latest
#     event names;
#   * the audit tail carries one row per delivered event: six rows.
product:
  name: customer_ods
  domain: crm
  version: "1.0"
  layer: integrated
  profile: serving
  owner: fixture-team

sources:
  - contract: crm.customer_events@1
    expect:
      fields: [event_id, source_system, source_key, entity_id, customer_name, customer_segment, loyalty_points, changed_at, operation]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: abort
    rules:
      - field: entity_id
        not_null: true
      - field: source_key
        not_null: true
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The operational data store over the delivered change events: one entity relation, one cross-reference relation and one audit tail."
    ownership: fixture-team
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: ods
  shape_config:
    entities:
      - name: customer
        key: [entity_id]
        attributes: [customer_name, customer_segment, loyalty_points]
        change_column: changed_at
        source_system_column: source_system
        source_key_column: source_key
        operation_column: operation
        description: "The customer entity, resolved across both source systems."
  contract:
    freshness: "daily by 08:00 UTC"
    access:
      classification: confidential

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
  checkpoint: true
