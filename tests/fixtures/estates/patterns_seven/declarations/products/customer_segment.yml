# The reference product an as-of enrichment reads. Its source is bound to a
# fixture relation for local proof (architecture section 12), so nothing in
# this estate has to publish the segment history for the estate to build.
product:
  name: customer_segment
  domain: retail
  version: "1.0"
  layer: shaped
  owner: retail-domain

sources:
  - contract: retail.segment_history@1
    kind: fixture
    fixture:
      relation: segment_history
      fields:
        - {name: segment_code, type: string}
        - {name: segment_name, type: string}
        - {name: effective_from, type: date}
    expect:
      fields: [segment_code, segment_name, effective_from]

steps:
  - pattern: batch_transfer
  - pattern: data_validation
    on_failure: warn
    rules:
      - field: segment_code
        not_null: true
  - pattern: calculated_fields
    fields:
      - {name: segment_label, type: string, expression: "upper(segment_name)"}
  - pattern: data_contracts
  - pattern: lineage_capture
  - pattern: metadata_capture
    description: "The segment each customer segment code stands for, effective from a date."
    ownership: retail-domain
  - pattern: schema_publish
  - pattern: data_publish
    publication_mode: atomic

target:
  shape: declared
  contract:
    freshness: "daily by 05:00 UTC"
    access:
      classification: internal

checkpointing:
  granularity: step
  max_retries: 2
  backoff: fixed
