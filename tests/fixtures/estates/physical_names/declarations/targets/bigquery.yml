# Structural budget declaration for the bigquery deployment target, which
# gates this fixture estate offline.
adapter: bigquery
kind: deployment
budgets:
  # Consecutive view levels a single statement expands. Every relation this
  # estate's products publish materialises as a table; the one view level
  # either product renders is data_validation's checked relation, which the
  # product's own published table reads.
  max_view_chain_depth: 1
  max_statement_bytes: 262144
  max_relation_identifier_chars: 255
  max_column_identifier_chars: 255
  max_description_bytes: 1024
  max_seed_rows: 10000
  max_seed_bytes: 10485760
