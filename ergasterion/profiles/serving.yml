# Reference profile: serving (architecture section 5, "Deliver for a named
# consumer"). mandatory/optional/forbidden are architecture section 5's
# table for this profile, carried verbatim -- note that Schema Transform and
# Data Enrichment are not classified at all for this profile (neither
# mandatory, optional nor forbidden): the table leaves them unmodelled here,
# and this profile's data does not invent a classification the architecture
# does not state. Schema Publish is optional here (unlike every other
# profile, where it is mandatory): a served product need not always publish
# a schema of its own.
#
# ordering is architecture section 3.1's composition order, filtered to the
# patterns this profile classifies as mandatory or optional: transfer, then
# validation, then the business-logic phase this profile admits
# (calculated_fields, data_filtering, data_aggregation, data_curation), then
# the publication phase, with checkpoint_retries last because it is the
# enclosing wrapper, not a sequential step.
schema: ergasterion.profile/v1
name: serving
description: Deliver for a named consumer
mandatory:
  - batch_transfer
  - data_validation
  - data_contracts
  - lineage_capture
  - metadata_capture
  - data_publish
  - checkpoint_retries
optional:
  - calculated_fields
  - data_filtering
  - data_aggregation
  - data_curation
  - schema_publish
forbidden:
  - batch_ingestion
ordering:
  - batch_transfer
  - data_validation
  - calculated_fields
  - data_filtering
  - data_aggregation
  - data_curation
  - data_contracts
  - lineage_capture
  - metadata_capture
  - schema_publish
  - data_publish
  - checkpoint_retries
