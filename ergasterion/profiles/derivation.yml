# Reference profile: derivation (architecture section 5, "Compute on top of
# integrated products"). mandatory/optional/forbidden are architecture
# section 5's table for this profile, carried verbatim -- note that Schema
# Transform is not classified at all for this profile (neither mandatory,
# optional nor forbidden): the table leaves it unmodelled here, and this
# profile's data does not invent a classification the architecture does not
# state.
#
# ordering is architecture section 3.1's composition order, filtered to the
# patterns this profile classifies as mandatory or optional: transfer, then
# validation, then the business-logic phase this profile admits
# (calculated_fields, data_enrichment, data_filtering, data_aggregation),
# then the publication phase, with checkpoint_retries last because it is the
# enclosing wrapper, not a sequential step.
schema: ergasterion.profile/v1
name: derivation
description: Compute on top of integrated products
mandatory:
  - batch_transfer
  - data_validation
  - calculated_fields
  - data_contracts
  - lineage_capture
  - metadata_capture
  - schema_publish
  - data_publish
  - checkpoint_retries
optional:
  - data_enrichment
  - data_aggregation
  - data_filtering
forbidden:
  - batch_ingestion
  - data_curation
ordering:
  - batch_transfer
  - data_validation
  - calculated_fields
  - data_enrichment
  - data_filtering
  - data_aggregation
  - data_contracts
  - lineage_capture
  - metadata_capture
  - schema_publish
  - data_publish
  - checkpoint_retries
