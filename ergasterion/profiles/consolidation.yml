# Reference profile: consolidation (architecture section 5, "Combine two or
# more products into one"). mandatory/optional/forbidden are architecture
# section 5's table for this profile, carried verbatim -- note that Schema
# Transform and Data Filtering are not classified at all for this profile
# (neither mandatory, optional nor forbidden): the table leaves them
# unmodelled here, and this profile's data does not invent a classification
# the architecture does not state. Batch Transfer draws from two or more
# product contracts for this profile (architecture section 5); that
# constraint is a step-level configuration concern, not a composition set,
# so it is not repeated here.
#
# ordering is architecture section 3.1's composition order, filtered to the
# patterns this profile classifies as mandatory or optional: transfer, then
# validation, then the business-logic phase this profile admits
# (calculated_fields, data_enrichment, data_aggregation, data_curation for
# cross-product merge), then the publication phase, with checkpoint_retries
# last because it is the enclosing wrapper, not a sequential step.
schema: ergasterion.profile/v1
name: consolidation
description: Combine two or more products into one
mandatory:
  - batch_transfer
  - data_validation
  - data_contracts
  - lineage_capture
  - metadata_capture
  - schema_publish
  - data_publish
  - checkpoint_retries
optional:
  - calculated_fields
  - data_enrichment
  - data_aggregation
  - data_curation
forbidden:
  - batch_ingestion
ordering:
  - batch_transfer
  - data_validation
  - calculated_fields
  - data_enrichment
  - data_aggregation
  - data_curation
  - data_contracts
  - lineage_capture
  - metadata_capture
  - schema_publish
  - data_publish
  - checkpoint_retries
