# Structural budget declaration for the bigquery deployment target.
# ergasterion/structure_gate.py validates every emitted and hand-authored model
# against these budgets; an artefact exceeding a budget fails generation with
# the budget and the artefact named. The values are estate policy data, set to
# hold on this adapter and tightened where portability across the declared
# targets demands it.
adapter: bigquery
kind: deployment
budgets:
  # Consecutive view levels a single statement expands. A computation layer
  # materialises as a table and an interface artefact is one view deep at a
  # declared boundary (declarations/targets/interfaces.yml), so the ceiling
  # was one while every relation in the estate was one of those two things.
  #
  # A product route relation is neither. Each occurrence that cuts a
  # product's chain renders a view of its own between the relation the
  # composition opens with and the table the product publishes, and the
  # deepest chain this estate declares is a curated product validated both
  # before and after its resolution: the published table reads the
  # post-validation view, which reads the resolution view, which reads the
  # pre-validation view, which reads a table. Three levels is that chain,
  # measured rather than allowed for, so a fourth means a new chain-cutting
  # occurrence somebody looks at rather than a number somebody raises.
  max_view_chain_depth: 3
  # Source bytes of one model statement.
  max_statement_bytes: 262144
  # Relation identifiers: model, seed, and source table names.
  max_relation_identifier_chars: 255
  # Column identifiers: schema-file columns and seed CSV headers.
  max_column_identifier_chars: 255
  # One description string shipped as relation or column metadata.
  max_description_bytes: 1024
  # Data rows in one declared dbt seed. Larger feeds land through a source.
  max_seed_rows: 10000
  # Source bytes in one declared dbt seed CSV.
  max_seed_bytes: 10485760
