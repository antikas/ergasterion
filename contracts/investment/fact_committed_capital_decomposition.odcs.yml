domain: investment
description:
  purpose: 'Cross-source discrepancy DECOMPOSITION for committed_capital_usd. Where two sources assert
    different committed capital for the same resolved fund, this splits the gap into named explained components
    (unit_scale is computed from the two values; fx_currency, as_of_timing, scope_universe and methodology
    are 0-with-flag where the vault carries no basis to compute their magnitude) plus an unexplained residual.
    The six components sum to total_delta by construction -- that identity is asserted structurally by
    tests/assert_committed_capital_decomposition_identity.sql. Sits beside the survivorship winner (bv_fund_golden_record):
    the golden_source / golden value columns show WHICH won, the components show WHY the sources differ.
    Grain: one row per fund x disputed_attribute x ordered source pair (source_a < source_b) that genuinely
    disagrees. residual_over_tolerance flags a residual that exceeds committed_capital_residual_tolerance
    (default 1%) of the delta.'
